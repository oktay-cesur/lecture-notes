<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540" role="img" aria-labelledby="title desc">
  <title id="title">Bağlantısız IP: her paket ayrı</title>
  <desc id="desc">IP paketi 1, IP paketi 2 ve IP paketi 3 ayrı ayrı gönderilir; aralarında önceden kurulmuş bir konuşma durumu yoktur.</desc>
  <defs><marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="mo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker><marker id="mp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker></defs>
  <rect width="1600" height="540" rx="28" fill="#f8fafc"/>
  <g font-family="'Nunito', 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
    <text x="800.0" y="62" font-size="44" font-weight="800" fill="#0f172a" text-anchor="middle">Önce konuşma kurmadan, paket paket</text>
    <rect x="150" y="125" width="400" height="90" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="350" y="182" font-size="34" font-weight="800" fill="#0f172a" text-anchor="middle">IP paketi 1</text>
    <line x1="570" y1="170" x2="1150" y2="170" stroke="#7c3aed" stroke-width="7" stroke-linecap="round" marker-end="url(#mp)"/>
    <text x="1190" y="180" font-size="26" font-weight="700" fill="#475569" text-anchor="start">ayrı birim</text>
    <rect x="150" y="250" width="400" height="90" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="350" y="307" font-size="34" font-weight="800" fill="#0f172a" text-anchor="middle">IP paketi 2</text>
    <line x1="570" y1="295" x2="1150" y2="295" stroke="#7c3aed" stroke-width="7" stroke-linecap="round" marker-end="url(#mp)"/>
    <text x="1190" y="305" font-size="26" font-weight="700" fill="#475569" text-anchor="start">ayrı birim</text>
    <rect x="150" y="375" width="400" height="90" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="350" y="432" font-size="34" font-weight="800" fill="#0f172a" text-anchor="middle">IP paketi 3</text>
    <line x1="570" y1="420" x2="1150" y2="420" stroke="#7c3aed" stroke-width="7" stroke-linecap="round" marker-end="url(#mp)"/>
    <text x="1190" y="430" font-size="26" font-weight="700" fill="#475569" text-anchor="start">ayrı birim</text>
  </g>
</svg>
