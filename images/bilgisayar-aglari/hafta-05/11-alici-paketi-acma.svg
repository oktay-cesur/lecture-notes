<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="580" viewBox="0 0 1600 580" role="img" aria-labelledby="title desc">
  <title id="title">Alıcı paketi başlıklara bakarak açar</title>
  <desc id="desc">Ethernet türü içeride IPv4 olduğunu söyler ve içerik IP işlemesine verilir; IPv4 Protocol alanı 6 ise içerik TCP'ye verilir; TCP hangi uygulama ucuna ait olduğuna bakar.</desc>
  <defs><marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="mo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker><marker id="mp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker></defs>
  <rect width="1600" height="580" rx="28" fill="#f8fafc"/>
  <g font-family="'Nunito', 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
    <text x="800.0" y="62" font-size="44" font-weight="800" fill="#0f172a" text-anchor="middle">Her başlık bir sonraki işlemi seçtirir</text>
    <rect x="60" y="110" width="330" height="110" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
    <text x="225" y="178" font-size="32" font-weight="800" fill="#0f172a" text-anchor="middle">Ethernet türü</text>
    <rect x="430" y="110" width="640" height="110" rx="16" fill="#ffffff" stroke="#475569" stroke-width="3"/>
    <text x="750" y="178" font-size="30" font-weight="700" fill="#0f172a" text-anchor="middle">içeride IPv4 var</text>
    <line x1="1085" y1="165" x2="1195" y2="165" stroke="#475569" stroke-width="6" stroke-linecap="round" marker-end="url(#ms)"/>
    <rect x="1210" y="110" width="330" height="110" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="1375" y="178" font-size="30" font-weight="800" fill="#0f172a" text-anchor="middle">IP işlemesine ver</text>
    <rect x="60" y="260" width="330" height="110" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="225" y="328" font-size="32" font-weight="800" fill="#0f172a" text-anchor="middle">IPv4 Protocol</text>
    <rect x="430" y="260" width="640" height="110" rx="16" fill="#ffffff" stroke="#475569" stroke-width="3"/>
    <text x="750" y="328" font-size="30" font-weight="700" fill="#0f172a" text-anchor="middle">içeride TCP var (6)</text>
    <line x1="1085" y1="315" x2="1195" y2="315" stroke="#475569" stroke-width="6" stroke-linecap="round" marker-end="url(#ms)"/>
    <rect x="1210" y="260" width="330" height="110" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="1375" y="328" font-size="30" font-weight="800" fill="#0f172a" text-anchor="middle">TCP'ye ver</text>
    <rect x="60" y="410" width="330" height="110" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="225" y="478" font-size="32" font-weight="800" fill="#0f172a" text-anchor="middle">TCP</text>
    <rect x="430" y="410" width="640" height="110" rx="16" fill="#ffffff" stroke="#475569" stroke-width="3"/>
    <text x="750" y="460" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">bu veri hangi uygulama ucuna</text>
    <text x="750" y="498" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">/ bağlantıya ait?</text>
    <line x1="1085" y1="465" x2="1195" y2="465" stroke="#475569" stroke-width="6" stroke-linecap="round" marker-end="url(#ms)" stroke-dasharray="10 8"/>
    <rect x="1210" y="410" width="330" height="110" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3" stroke-dasharray="10 7"/>
    <text x="1375" y="478" font-size="30" font-weight="800" fill="#0f172a" text-anchor="middle">Taşıma portu</text>
  </g>
</svg>
