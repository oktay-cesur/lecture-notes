<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">Paket hedefini nereden bilecek</title>
  <desc id="desc">PC-A'dan çıkan paket PC-B, PC-C, PC-D ve diğer cihazlardan birine gidecektir.</desc>
  <defs><marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="mo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker><marker id="mp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker></defs>
  <rect width="1600" height="600" rx="28" fill="#f8fafc"/>
  <g font-family="'Nunito', 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
    <text x="800.0" y="62" font-size="44" font-weight="800" fill="#0f172a" text-anchor="middle">PC-A'dan çıkan paket kime gidecek?</text>
    <rect x="90" y="215" width="280" height="110" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="230" y="282" font-size="40" font-weight="800" fill="#0f172a" text-anchor="middle">PC-A</text>
    <line x1="380" y1="270" x2="690" y2="270" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
    <rect x="450" y="235" width="170" height="70" rx="35" fill="#ffffff" stroke="#475569" stroke-width="3"/>
    <text x="535" y="282" font-size="28" font-weight="800" fill="#2563eb" text-anchor="middle">paket</text>
    <line x1="700" y1="150" x2="700" y2="480" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
    <line x1="700" y1="150" x2="985" y2="150" stroke="#2563eb" stroke-width="6" stroke-linecap="round" marker-end="url(#mb)"/>
    <rect x="1000" y="105" width="300" height="90" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="1150" y="162" font-size="36" font-weight="800" fill="#0f172a" text-anchor="middle">PC-B</text>
    <line x1="700" y1="270" x2="985" y2="270" stroke="#2563eb" stroke-width="6" stroke-linecap="round" marker-end="url(#mb)"/>
    <rect x="1000" y="225" width="300" height="90" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="1150" y="282" font-size="36" font-weight="800" fill="#0f172a" text-anchor="middle">PC-C</text>
    <line x1="700" y1="390" x2="985" y2="390" stroke="#2563eb" stroke-width="6" stroke-linecap="round" marker-end="url(#mb)"/>
    <rect x="1000" y="345" width="300" height="90" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="1150" y="402" font-size="36" font-weight="800" fill="#0f172a" text-anchor="middle">PC-D</text>
    <line x1="700" y1="480" x2="985" y2="480" stroke="#2563eb" stroke-width="6" stroke-linecap="round" marker-end="url(#mb)" stroke-dasharray="10 8"/>
    <rect x="1000" y="445" width="300" height="70" rx="16" fill="#f1f5f9" stroke="#475569" stroke-width="3" stroke-dasharray="10 7"/>
    <text x="1150" y="492" font-size="36" font-weight="800" fill="#0f172a" text-anchor="middle">...</text>
    <text x="1330" y="160" font-size="54" font-weight="800" fill="#ea580c" text-anchor="start">?</text>
    <text x="1330" y="280" font-size="54" font-weight="800" fill="#ea580c" text-anchor="start">?</text>
    <text x="1330" y="400" font-size="54" font-weight="800" fill="#ea580c" text-anchor="start">?</text>
  </g>
</svg>
