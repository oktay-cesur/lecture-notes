    <line x1="600" y1="510" x2="500" y2="605" stroke="#ea580c" stroke-width="4" stroke-linecap="round"/>
    <line x1="600" y1="510" x2="710" y2="605" stroke="#ea580c" stroke-width="4" stroke-linecap="round"/>
    <line x1="600" y1="510" x2="920" y2="605" stroke="#ea580c" stroke-width="4" stroke-linecap="round"/>
