    <text x="1150" y="150" font-size="26" font-weight="700" fill="#475569" text-anchor="start">çok uygulama</text>
    <text x="1150" y="184" font-size="21" font-weight="600" fill="#475569" text-anchor="start">(çok sayıda uygulama protokolü)</text>
    <line x1="500" y1="345" x2="600" y2="425" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
