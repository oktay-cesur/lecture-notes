    <text x="345" y="150" font-size="30" font-weight="800" fill="#0f172a" text-anchor="middle">FTP</text>
    <rect x="440" y="100" width="150" height="75" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="515" y="150" font-size="30" font-weight="800" fill="#0f172a" text-anchor="middle">SMTP</text>
    <rect x="610" y="100" width="150" height="75" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="685" y="150" font-size="30" font-weight="800" fill="#0f172a" text-anchor="middle">DNS</text>
    <rect x="780" y="100" width="150" height="75" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="855" y="150" font-size="30" font-weight="800" fill="#0f172a" text-anchor="middle">SSH</text>
