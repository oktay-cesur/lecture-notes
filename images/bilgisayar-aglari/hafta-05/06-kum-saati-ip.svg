    <line x1="515" y1="175" x2="600" y2="265" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <line x1="685" y1="175" x2="600" y2="265" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <line x1="855" y1="175" x2="600" y2="265" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <line x1="1025" y1="175" x2="600" y2="265" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <rect x="100" y="100" width="150" height="75" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
