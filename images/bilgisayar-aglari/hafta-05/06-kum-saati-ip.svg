    <rect x="195" y="605" width="190" height="80" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
    <text x="290" y="657" font-size="28" font-weight="800" fill="#0f172a" text-anchor="middle">Ethernet</text>
    <rect x="405" y="605" width="190" height="80" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
    <text x="500" y="657" font-size="28" font-weight="800" fill="#0f172a" text-anchor="middle">Wi-Fi</text>
    <rect x="615" y="605" width="190" height="80" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
    <text x="710" y="657" font-size="28" font-weight="800" fill="#0f172a" text-anchor="middle">Seri hat</text>
    <rect x="825" y="605" width="190" height="80" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="3" stroke-dasharray="10 7"/>
    <text x="920" y="657" font-size="28" font-weight="800" fill="#0f172a" text-anchor="middle">...</text>
    <text x="1150" y="634" font-size="26" font-weight="700" fill="#475569" text-anchor="start">çok bağlantı teknolojisi</text>
