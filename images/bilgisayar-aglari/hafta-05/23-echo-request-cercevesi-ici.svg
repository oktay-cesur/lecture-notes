<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="630" viewBox="0 0 1600 630" role="img" aria-labelledby="title desc">
<title id="title">Echo Request çerçevesinin içi</title>
<desc id="desc">Ethernet çerçevesi, içinde IP paketini, onun içinde ICMP Echo Request mesajını taşır. Hedef MAC ARP ile öğrenilmiştir, hedef IP ve ICMP mesajı ping komutu ve aracından gelir; kaynak adresler A'nın yapılandırmasındandır. ARP çerçevenin içinde yer almaz, hedef MAC alanını gönderimden önce tamamlar.</desc>
<defs><marker id="m-bl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="m-or" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/></marker><marker id="m-pu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker><marker id="m-gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker><marker id="m-sl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs>
<rect width="1600" height="630" rx="28" fill="#f8fafc"/>
<g font-family="'Nunito', 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
<rect x="40" y="30" width="940" height="560" rx="22" fill="#ffffff" stroke="#475569" stroke-width="3"/>
<text x="70" y="78" font-size="30" font-weight="800" fill="#0f172a" text-anchor="start">Ethernet çerçevesi</text>
<rect x="70" y="100" width="420" height="110" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="280.0" y="132" font-size="20" font-weight="600" fill="#475569" text-anchor="middle">kaynak MAC</text>
<text x="280.0" y="170.45" font-size="27" font-weight="800" fill="#0f172a" text-anchor="middle">02:00:00:00:00:0A</text>
<rect x="520" y="100" width="430" height="110" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="735.0" y="132" font-size="20" font-weight="600" fill="#475569" text-anchor="middle">hedef MAC</text>
<text x="735.0" y="170.45" font-size="27" font-weight="800" fill="#0f172a" text-anchor="middle">02:00:00:00:00:0B</text>
<rect x="70" y="240" width="880" height="330" rx="18" fill="#f1f5f9" stroke="#2563eb" stroke-width="3"/>
<text x="98" y="286" font-size="28" font-weight="800" fill="#0f172a" text-anchor="start">IP paketi</text>
<rect x="98" y="306" width="400" height="100" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="298.0" y="338" font-size="20" font-weight="600" fill="#475569" text-anchor="middle">kaynak IP</text>
<text x="298.0" y="371.45" font-size="27" font-weight="800" fill="#0f172a" text-anchor="middle">192.168.10.10</text>
<rect x="520" y="306" width="400" height="100" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="720.0" y="338" font-size="20" font-weight="600" fill="#475569" text-anchor="middle">hedef IP</text>
<text x="720.0" y="371.45" font-size="27" font-weight="800" fill="#0f172a" text-anchor="middle">192.168.10.20</text>
<rect x="98" y="430" width="822" height="118" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="124" y="472" font-size="26" font-weight="800" fill="#0f172a" text-anchor="start">ICMP mesajı</text>
<text x="509" y="525" font-size="34" font-weight="800" fill="#2563eb" text-anchor="middle">Echo Request</text>
<rect x="1040" y="30" width="520" height="200" rx="16" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
<text x="1066" y="68" font-size="25" font-weight="800" fill="#16a34a" text-anchor="start">hedef MAC ← ARP ile öğrenildi</text>
<text x="1066" y="98" font-size="21" font-weight="600" fill="#475569" text-anchor="start">kaynak MAC ← A'nın yapılandırması</text>
<text x="1066" y="148" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">ARP ayrı bir alışveriştir:</text>
<text x="1066" y="178" font-size="21" font-weight="600" fill="#475569" text-anchor="start">çerçevenin içinde değil; hedef MAC</text>
<text x="1066" y="206" font-size="21" font-weight="600" fill="#475569" text-anchor="start">alanını gönderimden önce tamamlar.</text>
<line x1="1040" y1="155" x2="955" y2="155" stroke="#475569" stroke-width="5" stroke-linecap="round" marker-end="url(#m-sl)"/>
<rect x="1040" y="306" width="520" height="100" rx="16" fill="#ffffff" stroke="#475569" stroke-width="3"/>
<text x="1066" y="350" font-size="25" font-weight="800" fill="#0f172a" text-anchor="start">hedef IP ← ping komutundan</text>
<text x="1066" y="386" font-size="21" font-weight="600" fill="#475569" text-anchor="start">kaynak IP ← A'nın yapılandırması</text>
<line x1="1040" y1="356" x2="925" y2="356" stroke="#475569" stroke-width="5" stroke-linecap="round" marker-end="url(#m-sl)"/>
<rect x="1040" y="448" width="520" height="100" rx="16" fill="#ffffff" stroke="#475569" stroke-width="3"/>
<text x="1066" y="492" font-size="25" font-weight="800" fill="#0f172a" text-anchor="start">ICMP mesajı ← ping aracından</text>
<line x1="1040" y1="489" x2="925" y2="489" stroke="#475569" stroke-width="5" stroke-linecap="round" marker-end="url(#m-sl)"/>
</g>
</svg>
