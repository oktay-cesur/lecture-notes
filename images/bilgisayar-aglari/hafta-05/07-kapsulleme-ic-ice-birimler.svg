<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Aynı veri, iç içe dört birim</title>
  <desc id="desc">Ethernet çerçevesi içinde IP paketi, onun içinde TCP segmenti, onun içinde HTTP verisi bulunur.</desc>
  <defs><marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="mo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker><marker id="mp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker></defs>
  <rect width="1600" height="560" rx="28" fill="#f8fafc"/>
  <g font-family="'Nunito', 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
    <text x="800.0" y="62" font-size="44" font-weight="800" fill="#0f172a" text-anchor="middle">Her katman, üstten geleni yük olarak alır</text>
    <rect x="60" y="100" width="1480" height="400" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
    <text x="88" y="144" font-size="32" font-weight="800" fill="#0f172a" text-anchor="start">Ethernet çerçevesi</text>
    <text x="1512" y="144" font-size="22" font-weight="600" fill="#475569" text-anchor="end">Ağ erişimi</text>
    <rect x="120" y="160" width="1360" height="320" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="148" y="204" font-size="32" font-weight="800" fill="#0f172a" text-anchor="start">IP paketi</text>
    <text x="1452" y="204" font-size="22" font-weight="600" fill="#475569" text-anchor="end">İnternet</text>
    <rect x="180" y="220" width="1240" height="240" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="208" y="264" font-size="32" font-weight="800" fill="#0f172a" text-anchor="start">TCP segmenti</text>
    <text x="1392" y="264" font-size="22" font-weight="600" fill="#475569" text-anchor="end">Taşıma</text>
    <rect x="240" y="280" width="1120" height="160" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="800.0" y="370.0" font-size="34" font-weight="800" fill="#0f172a" text-anchor="middle">HTTP verisi</text>
    <text x="800.0" y="404.0" font-size="22" font-weight="600" fill="#475569" text-anchor="middle">Uygulama</text>
