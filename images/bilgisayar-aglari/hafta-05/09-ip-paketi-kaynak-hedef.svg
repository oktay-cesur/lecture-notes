<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
  <title id="title">IP paketinin kaynak ve hedef adresi</title>
  <desc id="desc">IP paketinde kaynak IP adresi 192.168.10.10, hedef IP adresi 192.168.10.20'dir.</desc>
  <defs><marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="mo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker><marker id="mp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker></defs>
  <rect width="1600" height="480" rx="28" fill="#f8fafc"/>
  <g font-family="'Nunito', 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
    <text x="800.0" y="62" font-size="44" font-weight="800" fill="#0f172a" text-anchor="middle">IP paketi: ağ düzeyindeki iki uç</text>
    <rect x="100" y="130" width="520" height="230" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="360" y="195" font-size="32" font-weight="800" fill="#0f172a" text-anchor="middle">Kaynak IP</text>
    <text x="360" y="290" font-size="46" font-weight="800" fill="#0f172a" text-anchor="middle">192.168.10.10</text>
    <rect x="980" y="130" width="520" height="230" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
    <text x="1240" y="195" font-size="32" font-weight="800" fill="#0f172a" text-anchor="middle">Hedef IP</text>
    <text x="1240" y="290" font-size="46" font-weight="800" fill="#0f172a" text-anchor="middle">192.168.10.20</text>
    <line x1="640" y1="245" x2="960" y2="245" stroke="#475569" stroke-width="7" stroke-linecap="round" marker-end="url(#ms)"/>
    <text x="800" y="222" font-size="30" font-weight="800" fill="#475569" text-anchor="middle">IP paketi</text>
  </g>
</svg>
