    <text x="1512" y="139" font-size="22" font-weight="600" fill="#475569" text-anchor="end">Ağ erişimi</text>
    <rect x="100" y="163" width="1400" height="378" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="128" y="207" font-size="32" font-weight="800" fill="#0f172a" text-anchor="start">IP paketi</text>
    <text x="1472" y="207" font-size="22" font-weight="600" fill="#475569" text-anchor="end">İnternet</text>
    <rect x="140" y="231" width="1320" height="286" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
