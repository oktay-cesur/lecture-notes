ns-serif" font-size="22" font-weight="bold" fill="#B45309">Web MAC</text><g><text x="805" y="673" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#0F766E">TCP SYN (Hedef Port: 80)</text><line x1="200" y1="685" x2="1412" y2="685" stroke="#0D9488" stroke-width="3" marker-end="url(#arr-teal)" /><circle cx="200" cy="685" r="5" fill="#0D9488" /></g><g><text x="805" y="723" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#0F766E">TCP SYN-ACK</text><line x1="1420" y1="735" x2="208" y2="735" stroke="#0D9488" stroke-width="3" marker-end="url(#arr-teal)" /><circle cx="1420" cy="735" r="5" fill="#0D9488" /></g><g><text x="805" y="768" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#0F766E">TCP ACK</text><line x1="200" y1="780" x2="1412" y2="780" stroke="#0D9488" stroke-width="3" marker-end="url(#arr-teal)" /><circle cx="200" cy="780" r="5" fill="#0D9488" /></g><g><text x="805" y="833" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="bold" fill="#15803D">HTTP GET /index.html (Host: ders.test)</text><line x1="200" y1="845" x2="1412" y2="845" stroke="#16A34A" stroke-width="3.5" marker-end="url(#arr-green)" /><circle cx="200" cy="845" r="5.5" fill="#16A34A" /></g><g><text x="805" y="898" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="bold" fill="#15803D">HTTP/1.1 200 OK</text><line x1="1420" y1="910" x2="208" y2="910" stroke="#16A34A" stroke-width="3.5" marker-end="url(#arr-green)" /><circle cx="1420" cy="910" r="5.5" fill="#16A34A" /></g><line x1="600" x2="600" y1="205" y2="225" stroke="#2563EB" stroke-width="3" marker-end="url(#arr-blue)" /><line x1="1010" x2="1010" y1="205" y2="225" stroke="#2563EB" stroke-width="3" marker-end="url(#arr-blue)" /><line x1="1420" x2="1420" y1="205" y2="225" stroke="#2563EB" stroke-width="3" marker-end="url(#arr-blue)" 