<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560" width="1440" height="560" role="img"><title>Workbench Temsili Çalışma Haritası</title><desc>MySQL Workbench arayüzünün Gezgin, SQL editörü, sonuç ızgarası ve çıktı alanını gösteren temsili yerleşim şeması.</desc><rect width="1440" height="560" fill="#ffffff" /><rect x="40" y="14" width="280" height="30" rx="6" fill="#f0fdfa" stroke="#087f8c" stroke-width="1.5" /><text x="180" y="36" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#087f8c" text-anchor="middle">Temsili çalışma haritası</text><rect x="40" y="55" width="370" height="448" rx="10" fill="#f8fafc" stroke="#087f8c" stroke-width="2" /><path d="M 40 65 Q 40 55 50 55 L 400 55 Q 410 55 410 65 L 410 115 L 40 115 Z" fill="#e6fffa" /><line x1="40" y1="115" x2="410" y2="115" stroke="#087f8c" stroke-width="1.5" /><text x="65" y="98" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#172b3a">Gezgin</text><text x="190" y="96" font-family="Arial, sans-serif" font-size="22" fill="#087f8c">(Navigator)</text><rect x="62" y="140" width="326" height="115" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" /><rect x="62" y="140" width="8" height="115" rx="4" fill="#087f8c" /><text x="86" y="185" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#172b3a">Veritabanları</text><text x="86" y="225" font-family="Arial, sans-serif" font-size="22" fill="#475569">Şemalar / Schemas</text><rect x="62" y="280" width="326" height="115" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" /><rect x="62" y="280" width="8" height="115" rx="4" fill="#2563eb" /><text x="86" y="325" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#172b3a">Tablolar / sütunlar</text><text x="86" y="365" font-family="Arial, sans-serif" font-size="22" fill="#475569">Tablo ve nesne ağacı</text><text x="225" y="465" font-family="Arial, sans-serif" font-size="22" fill="#64748b" text-anchor="middle">Veritaban