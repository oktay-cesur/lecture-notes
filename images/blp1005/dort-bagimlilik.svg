    <rect x="18" y="28" width="50" height="80" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
    <text x="43" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#0369a1" text-anchor="middle">4</text>
    <g id="grouped-determinant">
      <rect x="90" y="16" width="440" height="103" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2.5" />
      <text x="310" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#0369a1" text-anchor="middle">(Birlikte Belirleyen Grup)</text>
      <rect x="105" y="52" width="235" height="54" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
      <text x="222" y="87" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#0369a1" text-anchor="middle">ogrenci_numarasi</text>
      <text x="352" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#0284c7" text-anchor="middle">,</text>
      <rect x="365" y="52" width="150" height="54" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
      <text x="440" y="87" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#0369a1" text-anchor="middle">ders_kodu</text>
    </g>
    <line x1="550" y1="68" x2="665" y2="68" stroke="#0284c7" stroke-width="4" marker-end="url(#dep-arrow-blue)" />
    <text x="605" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#0284c7" text-anchor="middle">belirler</text>
    <rect x="690" y="32" width="320" height="72" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" />
    <text x="850" y="77" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#0f766e" text-anchor="middle">basari_notu</text>
    <text x="1035" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#475569">Yalnız öğrenci veya ders yetmez.</text>
    <text x="1035" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#475569">bilinemez; ikisi birlikte belirler.</text>
