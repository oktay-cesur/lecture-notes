    <rect x="18" y="18" width="50" height="76" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
    <text x="43" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#0369a1" text-anchor="middle">3</text>
    <rect x="90" y="20" width="440" height="72" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" />
    <text x="310" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#0369a1" text-anchor="middle">ogretim_uyesi_no</text>
    <line x1="550" y1="56" x2="665" y2="56" stroke="#0284c7" stroke-width="4" marker-end="url(#dep-arrow-blue)" />
    <text x="605" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#0284c7" text-anchor="middle">belirler</text>
    <rect x="690" y="20" width="320" height="72" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" />
    <text x="850" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#0f766e" text-anchor="middle">ogretim_uyesi_adi</text>
    <rect x="1035" y="20" width="320" height="72" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" />
    <text x="1195" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#0f766e" text-anchor="middle">ogretim_uyesi_bolumu</text>
  </g>
  <g id="row-4" transform="translate(60, 486)" filter="url(#dep-shadow)">
