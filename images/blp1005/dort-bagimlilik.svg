<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 650" width="1500" height="650" role="img" aria-labelledby="title-bagimlilik desc-bagimlilik">
  <title id="title-bagimlilik">Dört İş Kuralı ve Fonksiyonel Bağımlılıklar</title>
  <desc id="desc-bagimlilik">Kurum iş kurallarından çıkarılan dört fonksiyonel bağımlılığı; belirleyen ve belirlenen nitelikleri yatay düzende gösteren diyagram.</desc>
  <defs>
    <marker id="dep-arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 Z" fill="#0284c7" />
    </marker>
    <filter id="dep-shadow" x="-3%" y="-5%" width="106%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>
  <rect width="1500" height="650" fill="#f8fafc" />
  <text x="60" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Dört İş Kuralı, Dört Bağımlılık</text>
  <text x="160" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="bold" fill="#0369a1">Belirleyen Nitelik(ler)</text>
  <text x="750" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="bold" fill="#0f766e">Belirlenen Nitelik(ler)</text>
  <g id="row-1" transform="translate(60, 90)" filter="url(#dep-shadow)">
