<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 650" width="1500" height="650" role="img" aria-labelledby="title-09 desc-09">
  <title id="title-09">Kütüphane Varlık-İlişki Modeli</title>
  <desc id="desc-09">Kütüphane bilgi sistemi için 5 varlık ve aralarındaki 4 ilişkiyi Crow's Foot notasyonuyla gösteren tam kavramsal Varlık-İlişki diyagramı.</desc>
  <defs>
    <filter id="card-shadow-09" x="-4%" y="-4%" width="108%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>
  <rect width="1500" height="650" fill="#f8fafc" />
  <g id="legend-card" filter="url(#card-shadow-09)">
