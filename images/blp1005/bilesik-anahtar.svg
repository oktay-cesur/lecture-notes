    <text x="950" y="126" font-size="32" font-weight="bold" fill="#1d4ed8" text-anchor="middle">2026-10-01</text>


    <text x="460" y="174" font-size="32" font-weight="bold" fill="#087f8c" text-anchor="middle">101</text>
    <text x="690" y="174" font-size="32" font-weight="bold" fill="#087f8c" text-anchor="middle">K-101</text>
    <text x="950" y="174" font-size="32" font-weight="bold" fill="#1d4ed8" text-anchor="middle">2026-10-20</text>
  </g>


  <text x="810" y="65" fill="#087f8c" font-size="32" font-family="Arial, sans-serif" font-weight="bold">Üye + kitap aynı</text><text x="810" y="112" fill="#087f8c" font-size="34" font-family="Arial, sans-serif" font-weight="bold">101 + K-101</text><text x="810" y="158" fill="#1d4ed8" font-size="32" font-family="Arial, sans-serif" font-weight="bold">Alış günleri farklı</text><rect x="40" y="204" width="1200" height="56" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2" /><text x="60" y="242" fill="#172b3a" font-size="32" font-family="Arial, sans-serif" font-weight="bold">Üye + kitap ikilisi bu iki olayı ayıramaz.</text><text x="40" y="304" fill="#172b3a" font-size="30" font-family="Arial, sans-serif">Üçlü: aynı üye–kitap çifti için günde en fazla bir ödünç varsa yeterli.</text></svg>