    <line x1="360" y1="140" x2="1080" y2="140" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="560" y1="32" x2="560" y2="188" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="820" y1="32" x2="820" y2="188" stroke="#cbd5e1" stroke-width="1.5" />


    <text x="460" y="70" font-size="32" font-weight="bold" fill="#172b3a" text-anchor="middle">Üye no</text>
    <text x="690" y="70" font-size="32" font-weight="bold" fill="#172b3a" text-anchor="middle">Demirbaş no</text>
    <text x="950" y="70" font-size="32" font-weight="bold" fill="#172b3a" text-anchor="middle">Alış tarihi</text>
