<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" style="background-color: #ffffff; font-family: Arial, sans-serif;">
  <title>Aynı üye ve kitabın farklı günlerdeki iki ödünç olayı</title>
