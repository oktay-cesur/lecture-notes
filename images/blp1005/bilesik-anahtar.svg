  <rect width="1280" height="360" fill="#ffffff" /><g id="tablo" transform="translate(-320,-12)">

    <rect x="360" y="32" width="720" height="156" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />


    <path d="M 360,40 Q 360,32 368,32 L 1072,32 Q 1080,32 1080,40 L 1080,92 L 360,92 Z" fill="#f8fafc" />


    <rect x="361" y="93" width="458" height="46" fill="#f0fdfa" />
