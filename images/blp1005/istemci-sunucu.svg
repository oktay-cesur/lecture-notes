<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560" width="1440" height="560" role="img"><title>MySQL İstemci, Sunucu ve Veri Dosyaları Mimarisi</title><desc>MySQL Workbench istemcisi, MySQL sunucusu ve disk üzerindeki veri dosyaları arasındaki veri akışını gösteren şema.</desc><defs><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1.5 L 8 5 L 1 8.5 z" fill="#087f8c"/></marker><marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1.5 L 8 5 L 1 8.5 z" fill="#172b3a"/></marker><marker id="arrow-blue-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1.5 L 8 5 L 1 8.5 z" fill="#1d4ed8"/></marker><marker id="arrow-blue-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 8 1.5 L 1 5 L 8 8.5 z" fill="#1d4ed8"/></marker></defs><rect width="1440" height="560" fill="#ffffff"/><rect x="45" y="55" width="340" height="310" rx="16" fill="#ffffff" stroke="#087f8c" stroke-width="2.5"/><path d="M 45 71 A 16 16 0 0 1 61 55 L 369 55 A 16 16 0 0 1 385 71 L 385 145 L 45 145 Z" fill="#f0fdfa"/><line x1="45" y1="145" x2="385" y2="145" stroke="#ccfbf1" stroke-width="2"/><text x="215" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#172b3a">MySQL Workbench</text><text x="215" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#087f8c">İstemci</text><text x="215" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#172b3a">Komutu yazar,</text><text x="215" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#172b3a">yanıtı gösterir</text><rect x="550" y="55" width="340" height="310" rx="16" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/><path d="M 550 71 A 16 16 0 0 1 566 55 L 874 55 A 16 16 0 0 1 890 71 L 890 145 L 550 145 Z" fill="#eff6ff"/><line x1="550" y1="145" x2="890" y2="145" stroke="#dbeafe" stroke-width="2"/><text x="720" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#172b3a">MySQL Sunucusu</text><text x="720" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1d4ed8">VTYS</text><text x="720" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#172b3a">İsteği yürütür</text><rect x="1055" y="55" width="340" height="310" rx="16" fill="#ffffff" stroke="#475569" stroke-width="2.5"/><path d="M 1055 71 A 16 16 0 0 1 1071 55 L 1379 55 A 16 16 0 0 1 1395 71 L 1395 145 L 1055 145 Z" fill="#f8fafc"/><line x1="1055" y1="145" x2="1395" y2="145" stroke="#e2e8f0" stroke-width="2"/><text x="1225" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#172b3a">Veri Dosyaları</text><text x="1225" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#475569">Disk</text><text x="1225" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#172b3a">Veri saklanır</text><text x="468" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#087f8c">SQL komutu</text><line x1="387" y1="195" x2="540" y2="195" stroke="#087f8c" stroke-width="3.5" marker-end="url(#arrow-teal)"/><text x="468" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold"><tspan fill="#172b3a">Sonuç</tspan><tspan fill="#64748b"> / </tspan><tspan fill="#ea580c">hata</tspan></text><line x1="548" y1="275" x2="395" y2="275" stroke="#172b3a" stroke-width="3.5" marker-end="url(#arrow-dark)"/><text x="973" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1d4ed8">Okuma / yazma</text><line x1="898" y1="235