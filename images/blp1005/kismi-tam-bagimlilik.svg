<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 700" width="100%" height="100%" role="img" style="background-color:#f8fafc; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <title>Kısmi ve Tam Fonksiyonel Bağımlılık</title>
  <desc>Bileşik anahtarlı bir yapıda kısmi bağımlılık (2NF ihlali) ile tam fonksiyonel bağımlılık (2NF gereksinimi) arasındaki farkı gösteren kavramsal şema.</desc>
  <defs>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea580c" />
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0d9488" />
    </marker>
  </defs>

  <rect width="1500" height="700" fill="#f8fafc" />
  <text x="750" y="48" font-size="30" font-weight="bold" fill="#0f172a" text-anchor="middle">Fonksiyonel Bağımlılık: Kısmi ve Tam Bağımlılık Karşılaştırması</text>


  <g id="panel-kismi">
    <rect x="40" y="75" width="860" height="595" rx="16" fill="#ffffff" stroke="#f97316" stroke-width="2.5" />
    <rect x="60" y="95" width="820" height="48" rx="8" fill="#fff7ed" />
    <text x="470" y="128" font-size="26" font-weight="bold" fill="#c2410c" text-anchor="middle">Kısmi bağımlılık</text>
    <rect x="65" y="195" width="280" height="390" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" />
    <text x="205" y="230" font-size="22" font-weight="bold" fill="#334155" text-anchor="middle">Tek Bileşik Anahtar (PK)</text>


    <rect x="85" y="250" width="240" height="90" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
    <text x="205" y="288" font-size="24" font-weight="bold" fill="#0369a1" text-anchor="middle">ogrenci_numarasi</text>
    <text x="205" y="322" font-size="22" fill="#0284c7" text-anchor="middle">Anahtarın bir parçası</text>


    <rect x="85" y="420" width="240" height="90" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
    <text x="205" y="458" font-size="24" font-weight="bold" fill="#0369a1" text-anchor="middle">ders_kodu</text>
    <text x="205" y="492" font-size="22" fill="#0284c7" text-anchor="middle">Anahtarın bir parçası</text>


    <line x1="325" y1="295" x2="435" y2="295" stroke="#ea580c" stroke-width="3.5" marker-end="url(#arr-orange)" />
    <text x="380" y="280" font-size="22" font-weight="bold" fill="#ea580c" text-anchor="middle">belirler</text>

    <rect x="445" y="245" width="435" height="100" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2" />
    <text x="662" y="286" font-size="26" font-weight="bold" fill="#9a3412" text-anchor="middle">ad_soyad, telefon</text>
    <text x="662" y="324" font-size="22" fill="#c2410c" text-anchor="middle">Kısmi bağımlılık (Yalnızca öğrenciye ait)</text>


    <line x1="325" y1="465" x2="405" y2="465" stroke="#ea580c" stroke-width="3.5" marker-end="url(#arr-orange)" />
    <text x="365" y="450" font-size="22" font-weight="bold" fill="#ea580c" text-anchor="middle">belirler</text>


    <rect x="415" y="400" width="220" height="130" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2" />
    <text x="525" y="438" font-size="24" font-weight="bold" fill="#9a3412" text-anchor="middle">ders_adi</text>
    <text x="525" y="476" font-size="24" font-weight="bold" fill="#9a3412" text-anchor="middle">ogretim_uyesi_no</text>
    <text x="525" y="512" font-size="22" fill="#c2410c" text-anchor="middle">(Kısmi bağımlılık)</text>


    <line x1="635" y1="465" x2="675" y2="465" stroke="#ea580c" stroke-width="3" marker-end="url(#arr-orange)" />


    <rect x="685" y="400" width="195" height="130" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2" />
    <text x="782" y="438" font-size="22" font-weight="bold" fill="#9a3412" text-anchor="middle">öğretim üyesi adı</text>
    <text x="782" y="474" font-size="22" font-weight="bold" fill="#9a3412" text-anchor="middle">bölümü</text>
    <text x="782" y="512" font-size="22" fill="#c2410c" text-anchor="middle">(Zincir üzerinden)</text>


    <rect x="65" y="600" width="815" height="50" rx="8" fill="#ffedd5" />
    <text x="472" y="633" font-size="22" font-weight="bold" fill="#9a3412" text-anchor="middle">Anahtarın bir parçası yeterli.</text>
  </g>


  <g id="panel-tam">
    <rect x="930" y="75" width="530" height="595" rx="16" fill="#ffffff" stroke="#0d9488" stroke-width="2.5" />
    <rect x="950" y="95" width="490" height="48" rx="8" fill="#f0fdfa" />
    <text x="1195" y="128" font-size="26" font-weight="bold" fill="#0f766e" text-anchor="middle">Tam bağımlılık</text>
    <rect x="955" y="195" width="480" height="145" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
    <text x="1195" y="230" font-size="22" font-weight="bold" fill="#0369a1" text-anchor="middle">Bileşik Anahtarın TAMAMI</text>

    <rect x="975" y="248" width="200" height="70" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
    <text x="1075" y="291" font-size="22" font-weight="bold" fill="#0f172a" text-anchor="middle">ogrenci_numarasi</text>

    <text x="1195" y="292" font-size="28" font-weight="bold" fill="#0284c7" text-anchor="middle">+</text>

    <rect x="1215" y="248" width="200" height="70" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
    <text x="1315" y="291" font-size="22" font-weight="bold" fill="#0f172a" text-anchor="middle">ders_kodu</text>


    <line x1="1195" y1="340" x2="1195" y2="405" stroke="#0d9488" stroke-width="4" marker-end="url(#arr-teal)" />
    <text x="1260" y="378" font-size="22" font-weight="bold" fill="#0d9488">birlikte belirler</text>


    <rect x="955" y="415" width="480" height="95" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5" />
    <text x="1195" y="456" font-size="28" font-weight="bold" fill="#115e59" text-anchor="middle">basari_notu</text>
    <text x="1195" y="490" font-size="22" fill="#0f766e" text-anchor="middle">Tam Fonksiyonel Bağımlılık</text>


    <rect x="955" y="525" width="480" height="125" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" />
    <text x="1195" y="557" font-size="22" font-weight="bold" fill="#991b1b" text-anchor="middle">✕ Yalnız öğrenci numarası notu belirleyemez</text>
    <text x="1195" y="592" font-size="22" font-weight="bold" fill="#991b1b" text-anchor="middle">✕ Yalnız ders kodu notu belirleyemez</text>
    <text x="1195" y="630" font-size="22" font-weight="bold" fill="#15803d" text-anchor="middle">✓ İkisi birlikte notu belirler</text>
  </g>
</svg>