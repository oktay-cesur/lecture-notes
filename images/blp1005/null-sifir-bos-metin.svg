<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560" width="1440" height="560" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">Veritabanında 0, Boş Metin ve NULL Karşılaştırması</title><desc id="svg-desc">Sayısal sıfır, boş metin ve NULL mantıksal değerlerinin karşılaştırması ve ceza hesabı senaryosu.</desc><rect width="1440" height="560" fill="#f8fafc"/><g id="kart-sayisal"><rect x="60" y="30" width="410" height="315" rx="14" fill="#ffffff" stroke="#087f8c" stroke-width="2"/><rect x="85" y="52" width="170" height="34" rx="6" fill="#e6f6f7"/><text x="170" y="76" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#087f8c" text-anchor="middle">SAYISAL SÜTUN</text><rect x="85" y="102" width="360" height="90" rx="8" fill="#f0fafb" stroke="#087f8c" stroke-width="1.5"/><text x="265" y="167" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#087f8c" text-anchor="middle">0</text><text x="265" y="235" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#172b3a" text-anchor="middle">Sayısal değer</text><text x="265" y="280" font-family="Arial, sans-serif" font-size="28" fill="#172b3a" text-anchor="middle">Miktar sıfır</text></g><g id="kart-metin"><rect x="515" y="30" width="410" height="315" rx="14" fill="#ffffff" stroke="#1d70b8" stroke-width="2"/><rect x="540" y="52" width="160" height="34" rx="6" fill="#eaf2f9"/><text x="620" y="76" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1d70b8" text-anchor="middle">METİN SÜTUNU</text><rect x="540" y="102" width="360" height="90" rx="8" fill="#f2f7fc" stroke="#1d70b8" stroke-width="1.5"/><text x="720" y="167" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#1d70b8" text-anchor="middle">''</text><text x="720" y="235" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#172b3a" text-anchor="middle">Boş metin</text><text x="720" y="280" font-family="Arial, sans-serif" font-size="28" fill="#172b3a" text-anchor="middle">Karakter sayısı: 0</text></g><g id="kart-null"><rect x="970" y="30" width="410" height="315" rx="14" fill="#ffffff" stroke="#e65100" stroke-width="2"/><rect x="995" y="52" width="190" height="34" rx="6" fill="#fef1ea"/><text x="1090" y="76" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#e65100" text-anchor="middle">DEĞER YOK / HER TİP</text><rect x="995" y="102" width="360" height="90" rx="8" fill="#fff7f2" stroke="#e65100" stroke-width="1.5" stroke-dasharray="6 4"/><text x="1175" y="167" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#e65100" text-anchor="middle">NULL</text><text x="1175" y="235" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#172b3a" text-anchor="middle">Değer yok</text><text x="1175" y="280" font-family="Arial, sans-serif" font-size="28" fill="#172b3a" text-anchor="middle">Bir değer verilmemiş</text></g><g id="senaryo-seridi"><rect x="60" y="375" width="1320" height="155" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="90" y="412" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#172b3a">İade sırasında hesaplanan ceza</text><g id="senaryo-0"><rect x="90" y="435" width="620" height="75" rx="8" fill="#f0fafb" stroke="#087f8c" stroke-width="1.5"/><rect x="110" y="447" width="90" height="50" rx="6" fill="#ffffff" stroke="#087f8c" stroke-width="1"/><text x="155" y="482" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#087f8c" text-anchor="middle">0.00</text><text x="225" y="482" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#172b3a">→</text><text x="265" y="482" font-family="Arial, sans-serif" font-size="28" fill="#172b3a">Hesaplandı: borç yok</text></g><g id="senaryo-null"><rect x="740" y="435" width="620" height="75" rx="8" fill="#fff7f2" stroke="#e65100" stroke-width="1.5"/><rect x="760" y="447" width="95" height="50" rx="6" fill="#ffffff" stroke="#e65100" stroke-width="1" stroke-dasharray="4 3"/><text x="807" y="482" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e65100" text-anchor="middle">NULL</text><text x="880" y="482" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#172b3a">→</text><text x="920" y="482" font-family="Arial, sans-serif" font-size="28" fill="#172b3a">Hesaplanmadı</text></g></g></svg>