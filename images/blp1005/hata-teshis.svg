<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 610" width="1440" height="610" role="img" aria-labelledby="diag-title diag-desc">
  <title id="diag-title">Veritabanı Hata Teşhis ve İnceleme Akışı</title>
  <desc id="diag-desc">Hata iletisini okuma, katman belirtilme durumuna göre doğrudan inceleme ve belirsiz iletilerde dört aşamalı pratik kontrol sırası ile hata kodları şeması.</desc>

  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#087f8c" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c" />
    </marker>
  </defs>


  <rect width="1440" height="610" fill="#ffffff" />


  <rect x="50" y="25" width="380" height="92" rx="12" fill="#ffffff" stroke="#172b3a" stroke-width="2.5" />
  <text x="75" y="64" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#172b3a">Hata İletisini Oku</text>
  <text x="75" y="97" font-family="Arial, sans-serif" font-size="22" fill="#475569">Hata kodu ve ileti metni</text>


  <line x1="430" y1="71" x2="684" y2="71" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow-teal)" />
  <rect x="445" y="48" width="220" height="46" rx="8" fill="#e6f6f7" stroke="#087f8c" stroke-width="1.5" />
  <text x="555" y="78" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#087f8c" text-anchor="middle">Katmanı söylüyor →</text>


  <rect x="690" y="25" width="700" height="92" rx="12" fill="#f0fdfa" stroke="#087f8c" stroke-width="2.5" />
  <text x="720" y="64" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#087f8c">Doğrudan O Katmanı İncele</text>
  <text x="720" y="97" font-family="Arial, sans-serif" font-size="22" fill="#172b3a">İletide belirtilen sorunu kontrol et.</text>


  <line x1="195" y1="117" x2="195" y2="182" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow-orange)" />
  <rect x="105" y="132" width="180" height="38" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
  <text x="195" y="158" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ea580c" text-anchor="middle">Belirsiz ise ↓</text>



  <rect x="50" y="188" width="290" height="250" rx="12" fill="#ffffff" stroke="#087f8c" stroke-width="2" />
  <rect x="68" y="204" width="130" height="30" rx="6" fill="#e0f2fe" />
  <text x="133" y="226" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0369a1" text-anchor="middle">1. KONTROL</text>
  <text x="68" y="276" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#172b3a">Bağlantı</text>
  <text x="68" y="328" font-family="Arial, sans-serif" font-size="28" fill="#087f8c">Sunucuya</text>
  <text x="68" y="360" font-family="Arial, sans-serif" font-size="28" fill="#087f8c">ulaşıldı mı?</text>
  <text x="68" y="412" font-family="Arial, sans-serif" font-size="22" fill="#64748b">Bağlantı ayarları / sunucu</text>


  <line x1="340" y1="313" x2="394" y2="313" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow-teal)" />


  <rect x="400" y="188" width="290" height="250" rx="12" fill="#ffffff" stroke="#087f8c" stroke-width="2" />
  <rect x="418" y="204" width="130" height="30" rx="6" fill="#e0f2fe" />
  <text x="483" y="226" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0369a1" text-anchor="middle">2. KONTROL</text>
  <text x="418" y="260" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#172b3a">Etkin</text>
  <text x="418" y="294" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#172b3a">Veritabanı</text>
  <text x="418" y="328" font-family="Arial, sans-serif" font-size="28" fill="#087f8c">Doğru</text>
  <text x="418" y="360" font-family="Arial, sans-serif" font-size="28" fill="#087f8c">veritabanı mı?</text>
  <text x="418" y="393" font-family="Arial, sans-serif" font-size="22" fill="#64748b">Gezginde veritabanına</text>
  <text x="418" y="420" font-family="Arial, sans-serif" font-size="22" fill="#64748b">çift tıkla; adı kalın mı?</text>


  <line x1="690" y1="313" x2="744" y2="313" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow-teal)" />


  <rect x="750" y="188" width="290" height="250" rx="12" fill="#ffffff" stroke="#087f8c" stroke-width="2" />
  <rect x="768" y="204" width="130" height="30" rx="6" fill="#e0f2fe" />
  <text x="833" y="226" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0369a1" text-anchor="middle">3. KONTROL</text>
  <text x="768" y="276" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#172b3a">Nesne Adı</text>
  <text x="768" y="328" font-family="Arial, sans-serif" font-size="28" fill="#087f8c">Tablo / sütun</text>
  <text x="768" y="360" font-family="Arial, sans-serif" font-size="28" fill="#087f8c">adı doğru mu?</text>
  <text x="768" y="412" font-family="Arial, sans-serif" font-size="22" fill="#64748b">Yazım ve harf duyarlılığı</text>


  <line x1="1040" y1="313" x2="1094" y2="313" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow-teal)" />


  <rect x="1100" y="188" width="290" height="250" rx="12" fill="#ffffff" stroke="#087f8c" stroke-width="2" />
  <rect x="1118" y="204" width="130" height="30" rx="6" fill="#e0f2fe" />
  <text x="1183" y="226" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0369a1" text-anchor="middle">4. KONTROL</text>
  <text x="1118" y="276" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#172b3a">Sözdizimi</text>
  <text x="1118" y="328" font-family="Arial, sans-serif" font-size="28" fill="#087f8c">Yazım düzeni</text>
  <text x="1118" y="360" font-family="Arial, sans-serif" font-size="28" fill="#087f8c">doğru mu?</text>
  <text x="1118" y="412" font-family="Arial, sans-serif" font-size="22" fill="#64748b">Virgül, tırnak, sözcükler</text>



  <rect x="50" y="470" width="400" height="112" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2" /><text x="70" y="508" fill="#c2410c" font-family="Arial, sans-serif" font-size="30" font-weight="bold">1046</text><text x="70" y="552" fill="#172b3a" font-family="Arial, sans-serif" font-size="26">Veritabanı seçilmemiş</text><rect x="520" y="470" width="400" height="112" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2" /><text x="540" y="508" fill="#c2410c" font-family="Arial, sans-serif" font-size="30" font-weight="bold">1146</text><text x="540" y="552" fill="#172b3a" font-family="Arial, sans-serif" font-size="26">Tablo bulunamadı</text><rect x="990" y="470" width="400" height="112" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2" /><text x="1010" y="508" fill="#c2410c" font-family="Arial, sans-serif" font-size="30" font-weight="bold">1064</text><text x="1010" y="552" fill="#172b3a" font-family="Arial, sans-serif" font-size="26">Sözdizimi hatası</text></svg>