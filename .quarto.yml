project:
  type: website
  output-dir: _site
  resources:
    - .assets/**
  render:
    - "**/*.md"
    - "**/*.qmd"
    - "!**/*-qmd-fallback.qmd"
    - "!**/_private/**"
    - "!**/_backup/**"
    - "!**/_arsiv/**"
    - "!_arsiv/**"
    - "!courses/qturkey/qbronze/crs-qbronze/**"
    - "!.assets/**"
    - "!README.md"

profile:
  group:
    - [default, local]

website:
  title: "Oktay Cesur"
  navbar:
    left:
      - text: "Ana Sayfa"
        href: index.md
      - text: "Dersler ve İzlenceler"
        menu:
          - text: "Tüm Dersler ve İzlenceler"
            href: izlence-index.md
          - text: "BİM444 — Yapay Zeka"
            href: courses/bim444/crs-bim444.md
          - text: "MATE 213 — Lineer Cebir"
            href: courses/lineer-cebir/crs-lineer-cebir.md
          - text: "MATE 214 — Diferansiyel Denklemler"
            href: courses/diferansiyel-denklemler/crs-diferansiyel-denklemler.md
          - text: "QTurkey Eğitimleri — QPrep ve QBronze"
            href: courses/qturkey/index.md
      - text: "Konular"
        menu:
          - text: "Tüm Konu Yazıları"
            href: konu-yazilari.md
          - text: "Yapay Zeka ve LLM Uygulamaları"
            href: topics/llm-uygulamalari/index.md
          - text: "Kuantum Hesaplama"
            href: topics/quantum/index.md
          - text: "Lineer Cebir"
            href: topics/lineer-cebir/index.md
      - text: "Serbest Yazılar"
        href: yazilar/index.md
    right:
      - icon: github
        href: https://github.com/oktay-cesur/lecture-notes

bibliography: references.bib

format:
  html:
    from: markdown+wikilinks_title_after_pipe
    theme:
      light: flatly
      dark: darkly
    toc: true
    toc-depth: 4
    lang: tr
    code-fold: true
    code-tools: true
    code-copy: true
    code-overflow: wrap
    css: styles.css
    filters:
      - .filters/obsidian-wikilink.lua
      - .filters/notes-to-text.lua
      - .filters/slide-link.lua
      - .filters/animation-assets.lua
