<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="baslik aciklama" font-family="DejaVu Sans, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#0f172a">
  <title id="baslik">Risk Kaydından Aksiyon Planına Geçiş Köprüsü</title>
  <desc id="aciklama">Risk değerlendirme kaydındaki tehdit, zafiyet ve risk seviyesinin; kurumsal karar eşiklerine göre işleme seçeneğine ve doğrulanabilir aksiyon planı alanlarına dönüştürülmesini gösteren köprü şeması.</desc>
  <defs>
    <marker id="ok-kopru" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 1 L9 5 L0 9 z" fill="#0369a1"/>
    </marker>
  </defs>

  <rect width="960" height="420" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Başlık -->
  <text x="480" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">UYGULAMA KÖPRÜSÜ: RİSK KAYDINDAN ONAYLI İŞLEME PLANINA</text>

  <!-- Sol Kart: Değerlendirme Kaydı Girdisi -->
  <rect x="30" y="65" width="260" height="260" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="30" y="65" width="260" height="38" rx="8" fill="#f1f5f9"/>
  <text x="160" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">H9 RİSK KAYDI (GİRDİ)</text>

  <rect x="45" y="115" width="230" height="50" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="55" y="136" font-size="11" font-weight="bold" fill="#475569">Varlık &amp; Tehdit:</text>
  <text x="55" y="152" font-size="11" fill="#0f172a">ayrilan-hesap / Yetkisiz Erişim</text>

  <rect x="45" y="175" width="230" height="50" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="55" y="196" font-size="11" font-weight="bold" fill="#991b1b">Mevcut Seviye:</text>
  <text x="55" y="212" font-size="11" fill="#7f1d1d">Yüksek × Yüksek → Yüksek Risk</text>

  <rect x="45" y="235" width="230" height="70" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="55" y="256" font-size="11" font-weight="bold" fill="#92400e">Kurumsal Karar Eşiği:</text>
  <text x="55" y="274" font-size="11" fill="#78350f">Yüksek risk kabul edilemez;</text>
  <text x="55" y="290" font-size="11" fill="#78350f">öncelikli tedbir zorunlu!</text>

  <!-- Ok Sol -> Orta -->
  <line x1="290" y1="195" x2="340" y2="195" stroke="#0369a1" stroke-width="2.5" marker-end="url(#ok-kopru)"/>

  <!-- Orta Kart: Karar ve İşleme Seçeneği -->
  <rect x="350" y="65" width="250" height="260" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="350" y="65" width="250" height="38" rx="8" fill="#eff6ff"/>
  <text x="475" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">İŞLEME KARARI</text>

  <rect x="365" y="115" width="220" height="60" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="375" y="137" font-size="11" font-weight="bold" fill="#1e40af">Seçilen Strateji: Azaltma</text>
  <text x="375" y="155" font-size="11" fill="#334155">2 hesabı kilitle + İK–BT haftalık</text>
  <text x="375" y="169" font-size="11" fill="#334155">mutabakat akışı kur.</text>

  <rect x="365" y="185" width="220" height="125" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="375" y="207" font-size="11" font-weight="bold" fill="#334155">Yönetsel Gerekçe:</text>
  <text x="375" y="227" font-size="11" fill="#475569">• Faaliyet durdurulamaz (Kaçınma yok)</text>
  <text x="375" y="245" font-size="11" fill="#475569">• Dışarı devredilemez (Paylaşma yok)</text>
  <text x="375" y="263" font-size="11" fill="#475569">• Yüksek risk kabul sınırı dışında</text>
  <text x="375" y="295" font-size="11" font-weight="bold" fill="#15803d">→ Azaltma tek geçerli yoldur.</text>

  <!-- Ok Orta -> Sağ -->
  <line x1="600" y1="195" x2="650" y2="195" stroke="#0369a1" stroke-width="2.5" marker-end="url(#ok-kopru)"/>

  <!-- Sağ Kart: Somut Aksiyon Kaydı Bileşenleri -->
  <rect x="660" y="65" width="270" height="260" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <rect x="660" y="65" width="270" height="38" rx="8" fill="#f0fdf4"/>
  <text x="795" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">H10 AKSİYON KAYDI (ÇIKTI)</text>

  <rect x="675" y="115" width="240" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="685" y="138" font-size="11" fill="#0f172a"><tspan font-weight="bold">Sorumlu:</tspan> Kayıt Yön. + BT Sorumlusu</text>

  <rect x="675" y="160" width="240" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="685" y="183" font-size="11" fill="#0f172a"><tspan font-weight="bold">Bitiş Tarihi:</tspan> 18–25 Kasım 2026</text>

  <rect x="675" y="205" width="240" height="50" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="685" y="225" font-size="11" font-weight="bold" fill="#0f172a">Doğrulama Kanıtı:</text>
  <text x="685" y="243" font-size="11" fill="#15803d">18 Kas. log + 26 Kas. tutanak</text>

  <rect x="675" y="262" width="240" height="50" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="685" y="282" font-size="11" font-weight="bold" fill="#166534">Artık Risk:</text>
  <text x="685" y="300" font-size="11" fill="#14532d">Beklenen: Orta (doğrulanmadı)</text>

  <!-- Alt Özet -->
  <rect x="30" y="335" width="900" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="50" y="356" font-size="12" font-weight="bold" fill="#0f172a">Rehber İlke:</text>
  <text x="50" y="375" font-size="12" fill="#334155">«Aksiyon planında 'güvenlik artırılacak' gibi soyut temenniler yer alamaz. Kimin neyi yapacağı,</text>
  <text x="50" y="393" font-size="12" fill="#334155">ne zaman teslim edeceği ve hangi kanıtla denetleneceği somut yazılmalıdır.»</text>
</svg>
