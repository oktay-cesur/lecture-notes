<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="baslik aciklama" font-family="DejaVu Sans, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#0f172a">
  <title id="baslik">Bilgi Güvenliği Olay Yönetimi Yaşam Döngüsü</title>
  <desc id="aciklama">Hazırlık, Tespit ve Bildirim, Müdahale ve Sınırlandırma, Hizmetin Sürmesi, Kurtarma ve Doğrulama ile Takip ve Öğrenme adımlarını döngüsel olarak gösteren olay yönetimi şeması.</desc>
  <defs>
    <marker id="ok-dongu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 1 L9 5 L0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="ok-ogrenme" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 1 L9 5 L0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="960" height="420" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Başlık -->
  <text x="480" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">OLAY YÖNETİMİNİN ALTI ADIMLI YAŞAM DÖNGÜSÜ</text>

  <!-- Üst Sıra: 1, 2, 3 -->
  <!-- Adım 1: Hazırlık -->
  <rect x="50" y="65" width="250" height="135" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="50" y="65" width="250" height="34" rx="8" fill="#eff6ff"/>
  <text x="65" y="88" font-size="13" font-weight="bold" fill="#1d4ed8">1 · HAZIRLIK</text>
  <text x="65" y="120" font-size="12" fill="#334155">• Ekipler ve roller belirlenir</text>
  <text x="65" y="140" font-size="12" fill="#334155">• İletişim matrisi ve kanallar hazır</text>
  <text x="65" y="160" font-size="12" fill="#334155">• Temel araçlar ve yetkiler tanımlı</text>
  <text x="65" y="182" font-size="11" font-weight="bold" fill="#0369a1">Olay olmadan önceki zemin</text>

  <!-- Ok 1 -> 2 -->
  <line x1="300" y1="132" x2="350" y2="132" stroke="#0284c7" stroke-width="2.5" marker-end="url(#ok-dongu)"/>

  <!-- Adım 2: Tespit ve Bildirim -->
  <rect x="355" y="65" width="250" height="135" rx="8" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/>
  <rect x="355" y="65" width="250" height="34" rx="8" fill="#fffbeb"/>
  <text x="370" y="88" font-size="13" font-weight="bold" fill="#b45309">2 · TESPİT VE BİLDİRİM</text>
  <text x="370" y="120" font-size="12" fill="#334155">• Log ve alarmların izlenmesi</text>
  <text x="370" y="140" font-size="12" fill="#334155">• Kullanıcı ihbarı / anormallik</text>
  <text x="370" y="160" font-size="12" fill="#334155">• Olay kaydı açılır, ilk sınıflandırma</text>
  <text x="370" y="182" font-size="11" font-weight="bold" fill="#b45309">Zaman damgalı ilk kayıt</text>

  <!-- Ok 2 -> 3 -->
  <line x1="605" y1="132" x2="655" y2="132" stroke="#0284c7" stroke-width="2.5" marker-end="url(#ok-dongu)"/>

  <!-- Adım 3: Müdahale ve Sınırlandırma -->
  <rect x="660" y="65" width="250" height="135" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="660" y="65" width="250" height="34" rx="8" fill="#fef2f2"/>
  <text x="675" y="88" font-size="13" font-weight="bold" fill="#b91c1c">3 · MÜDAHALE VE SINIRLAMA</text>
  <text x="675" y="120" font-size="12" fill="#334155">• Yayılmayı ve hasarı durdurma</text>
  <text x="675" y="140" font-size="12" fill="#334155">• Ağ izolasyonu / hesap dondurma</text>
  <text x="675" y="160" font-size="12" fill="#334155">• Delilleri karartmadan koruma</text>
  <text x="675" y="182" font-size="11" font-weight="bold" fill="#991b1b">Kritik ilk refleks: Yayılmayı kes</text>

  <!-- Dikey Ok: 3'ten 4'e (Aşağıya) -->
  <line x1="785" y1="200" x2="785" y2="235" stroke="#0284c7" stroke-width="2.5" marker-end="url(#ok-dongu)"/>

  <!-- Alt Sıra: 6 (Sol), 5 (Orta), 4 (Sağ) - Döngü yönü sağdan sola -->
  <!-- Adım 4: Hizmetin Sürmesi -->
  <rect x="660" y="240" width="250" height="135" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
  <rect x="660" y="240" width="250" height="34" rx="8" fill="#fff7ed"/>
  <text x="675" y="263" font-size="13" font-weight="bold" fill="#c2410c">4 · HİZMETİN SÜRMESİ</text>
  <text x="675" y="295" font-size="12" fill="#334155">• Temel iş fonksiyonlarını koruma</text>
  <text x="675" y="315" font-size="12" fill="#334155">• Manuel veya yedek çalışma kipi</text>
  <text x="675" y="335" font-size="12" fill="#334155">• İş sürekliliği önlemleri</text>
  <text x="675" y="357" font-size="11" font-weight="bold" fill="#9a3412">Kurumsal faaliyet aksamasın</text>

  <!-- Ok 4 -> 5 (Sola) -->
  <line x1="660" y1="307" x2="610" y2="307" stroke="#0284c7" stroke-width="2.5" marker-end="url(#ok-dongu)"/>

  <!-- Adım 5: Güvenli Kurtarma -->
  <rect x="355" y="240" width="250" height="135" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <rect x="355" y="240" width="250" height="34" rx="8" fill="#f0fdf4"/>
  <text x="370" y="263" font-size="13" font-weight="bold" fill="#15803d">5 · GÜVENLİ KURTARMA</text>
  <text x="370" y="295" font-size="12" fill="#334155">• Zafiyet yamandıktan sonra açılış</text>
  <text x="370" y="315" font-size="12" fill="#334155">• Temiz yedekten geri yükleme</text>
  <text x="370" y="335" font-size="12" fill="#334155">• Bütünlük ve işlev doğrulama</text>
  <text x="370" y="357" font-size="11" font-weight="bold" fill="#166534">Kontrollü ve test edilmiş dönüş</text>

  <!-- Ok 5 -> 6 (Sola) -->
  <line x1="355" y1="307" x2="305" y2="307" stroke="#0284c7" stroke-width="2.5" marker-end="url(#ok-dongu)"/>

  <!-- Adım 6: Takip ve Öğrenme -->
  <rect x="50" y="240" width="250" height="135" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <rect x="50" y="240" width="250" height="34" rx="8" fill="#faf5ff"/>
  <text x="65" y="263" font-size="13" font-weight="bold" fill="#6d28d9">6 · TAKİP VE ÖĞRENME</text>
  <text x="65" y="295" font-size="12" fill="#334155">• Kök neden analizi (RCA)</text>
  <text x="65" y="315" font-size="12" fill="#334155">• Alınan dersler (Lessons Learned)</text>
  <text x="65" y="335" font-size="12" fill="#334155">• Politika ve risk kaydı revizyonu</text>
  <text x="65" y="357" font-size="11" font-weight="bold" fill="#5b21b6">Sisteme kalıcı iyileştirme aktarımı</text>

  <!-- Geri Besleme Oku: 6'dan 1'e (Yukarı) -->
  <line x1="175" y1="240" x2="175" y2="205" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#ok-ogrenme)"/>
  <text x="185" y="224" font-size="11" font-weight="bold" fill="#15803d">Geri Besleme (BGYS İyileştirme)</text>
</svg>
