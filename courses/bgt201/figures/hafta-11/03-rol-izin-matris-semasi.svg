<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="baslik aciklama" font-family="DejaVu Sans, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#0f172a">
  <title id="baslik">Kuzey Üniversitesi ÖBS Rol-İzin Matrisi Mimarisi</title>
  <desc id="aciklama">Kurumsal iş rolleri ile bilgi varlıkları arasındaki okuma, yazma ve onay yetkilerini; en az ayrıcalık ve koşul mekanizmasıyla (kendi dersi, kendi bölümü) yapılandıran rol-izin matrisi şeması.</desc>

  <rect width="960" height="420" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Başlık -->
  <text x="480" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">KUZEY ÜNİVERSİTESİ ÖBS: ROL – İZİN MATRİSİ VE KOŞUL MEKANİZMASI</text>

  <!-- Matris Çerçevesi -->
  <rect x="30" y="60" width="900" height="265" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Başlık Satırı -->
  <rect x="30" y="60" width="900" height="40" rx="8" fill="#f1f5f9"/>
  <text x="130" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">ROL / AKTÖR</text>
  <text x="320" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">ders-notu (K-2)</text>
  <text x="510" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">ogrenci-iletisim (K-1)</text>
  <text x="700" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">yetki-yonetimi (K-3)</text>
  <text x="850" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Onay / Uygulama</text>

  <!-- Satır 1: Öğretim Elemanı -->
  <line x1="30" y1="100" x2="930" y2="100" stroke="#e2e8f0"/>
  <text x="45" y="128" font-size="12" font-weight="bold" fill="#3730a3">ogretim-elemani</text>
  <rect x="230" y="108" width="180" height="36" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="320" y="125" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">Çalışma tablosunda</text>
  <text x="320" y="138" text-anchor="middle" font-size="9" fill="#1e40af">[doldurulacak]</text>

  <rect x="430" y="108" width="160" height="36" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="510" y="125" text-anchor="middle" font-size="11" fill="#475569">Çalışma tablosunda</text>
  <text x="510" y="138" text-anchor="middle" font-size="9" fill="#64748b">[doldurulacak]</text>

  <rect x="620" y="108" width="160" height="36" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="700" y="131" text-anchor="middle" font-size="11" fill="#334155">Doldurulacak</text>

  <text x="850" y="131" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Doldurulacak</text>

  <!-- Satır 2: Öğrenci İşleri Uzmanı -->
  <line x1="30" y1="152" x2="930" y2="152" stroke="#e2e8f0"/>
  <text x="45" y="180" font-size="12" font-weight="bold" fill="#15803d">ogrenci-isleri</text>
  <rect x="230" y="160" width="180" height="36" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="320" y="177" text-anchor="middle" font-size="11" fill="#475569">Yalnızca Oku</text>
  <text x="320" y="190" text-anchor="middle" font-size="9" fill="#334155">[İlan edilmiş notlar]</text>

  <rect x="430" y="160" width="160" height="36" rx="4" fill="#f0fdf4" stroke="#86efac"/>
  <text x="510" y="177" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">Oku / Güncelle</text>
  <text x="510" y="190" text-anchor="middle" font-size="9" fill="#14532d">[Yalnız sorumlu program]</text>

  <rect x="620" y="160" width="160" height="36" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="700" y="183" text-anchor="middle" font-size="11" fill="#475569">ERİŞİM YOK ✗</text>

  <text x="850" y="183" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Onay: Öİ Müdürü</text>

  <!-- Satır 3: Bölüm Başkanı -->
  <line x1="30" y1="204" x2="930" y2="204" stroke="#e2e8f0"/>
  <text x="45" y="232" font-size="12" font-weight="bold" fill="#b45309">bolum-baskani</text>
  <rect x="230" y="212" width="180" height="36" rx="4" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="320" y="229" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">İncele / Onayla</text>
  <text x="320" y="242" text-anchor="middle" font-size="9" fill="#78350f">[Kendi programındaki dersler]</text>

  <rect x="430" y="212" width="160" height="36" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="510" y="229" text-anchor="middle" font-size="11" fill="#334155">Doldurulacak</text>
  <text x="510" y="242" text-anchor="middle" font-size="9" fill="#64748b">[rehbere göre]</text>

  <rect x="620" y="212" width="160" height="36" rx="4" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="700" y="229" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">Doldurulacak</text>
  <text x="700" y="242" text-anchor="middle" font-size="9" fill="#78350f">[rehbere göre]</text>

  <text x="850" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Onay: Bölüm Bşk.</text>

  <!-- Satır 4: BT Yetki Yöneticisi -->
  <line x1="30" y1="256" x2="930" y2="256" stroke="#e2e8f0"/>
  <text x="45" y="284" font-size="12" font-weight="bold" fill="#0284c7">bt-yoneticisi</text>
  <text x="320" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">İçerik Görülmez ✗</text>
  <text x="510" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">İçerik Görülmez ✗</text>
  <text x="700" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Rolü uygular</text>
  <rect x="795" y="264" width="115" height="36" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="852" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">Teknik uygulama</text>
  <text x="852" y="294" text-anchor="middle" font-size="9" fill="#1e40af">[Onaylı kararı işler]</text>

  <!-- Alt Özet -->
  <rect x="30" y="340" width="900" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="50" y="356" font-size="12" font-weight="bold" fill="#0f172a">Görevler Ayrılığı (SoD) Güvencesi:</text>
  <text x="50" y="375" font-size="12" fill="#334155">«Öğretim elemanı düzeltme hazırlar ama onaylayamaz; bölüm başkanı onaylar ama kendi dersinin düzeltmesini onaylayamaz;</text>
  <text x="50" y="393" font-size="12" fill="#334155">öğrenci işleri notları yalnız okur; BT yetkiyi sisteme işler ama kayıt içeriğini göremez.»</text>
</svg>
