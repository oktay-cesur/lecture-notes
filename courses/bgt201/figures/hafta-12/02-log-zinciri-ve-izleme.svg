<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="baslik aciklama" font-family="DejaVu Sans, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#0f172a">
  <title id="baslik">Kayıt (Logging) ile İzleme (Monitoring) Arasındaki Mimari Zincir</title>
  <desc id="aciklama">Farklı kaynaklardan üretilen logların NTP zaman senkronizasyonu ile merkezi log havuzuna aktarılmasını, pasif birikimden aktif kural motoru ve analist incelemesiyle alarmlara ve denetim kanıtına dönüşmesini gösteren şema.</desc>
  <defs>
    <marker id="ok-log" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 1 L9 5 L0 9 z" fill="#0369a1"/>
    </marker>
    <marker id="ok-alarm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 1 L9 5 L0 9 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect width="960" height="420" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Başlık -->
  <text x="480" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">KAYITTAN İZLEMEYE: PASİF BİRİKİMDEN AKTİF GÜVENCEYE</text>

  <!-- 1. Katman: Log Kaynakları (Sol) -->
  <rect x="25" y="65" width="200" height="260" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="25" y="65" width="200" height="38" rx="8" fill="#f1f5f9"/>
  <text x="125" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">1 · LOG KAYNAKLARI</text>

  <rect x="40" y="115" width="170" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="125" y="140" text-anchor="middle" font-size="11" fill="#0f172a">ÖBS Uygulama Logu</text>

  <rect x="40" y="165" width="170" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="125" y="190" text-anchor="middle" font-size="11" fill="#0f172a">Veritabanı Erişim Logu</text>

  <rect x="40" y="215" width="170" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="125" y="240" text-anchor="middle" font-size="11" fill="#0f172a">Sunucu / İşletim Sistemi</text>

  <!-- NTP Vurgusu -->
  <rect x="40" y="265" width="170" height="48" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="125" y="284" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">NTP Senkronizasyonu</text>
  <text x="125" y="300" text-anchor="middle" font-size="10" fill="#1e40af">Ortak zaman damgası şart</text>

  <!-- Ok 1 -> 2 -->
  <line x1="225" y1="195" x2="275" y2="195" stroke="#0369a1" stroke-width="2.5" marker-end="url(#ok-log)"/>

  <!-- 2. Katman: Merkezi Depo / SIEM (Orta) -->
  <rect x="285" y="65" width="275" height="260" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="285" y="65" width="275" height="38" rx="8" fill="#eff6ff"/>
  <text x="422" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">2 · MERKEZİ LOG VE BÜTÜNLÜK</text>

  <rect x="305" y="115" width="235" height="55" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="315" y="137" font-size="11" font-weight="bold" fill="#0f172a">KAYIT (LOGGING): Pasif Veri</text>
  <text x="315" y="155" font-size="11" fill="#475569">Olay gerçekleştiğinde sessizce yazar.</text>

  <rect x="305" y="180" width="235" height="60" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="315" y="202" font-size="11" font-weight="bold" fill="#166534">Bütünlük Koruması:</text>
  <text x="315" y="220" font-size="11" fill="#14532d">• Yalnızca ekleme (Append-only)</text>
  <text x="315" y="234" font-size="11" fill="#14532d">• Silme ve değiştirmeye kapalı</text>

  <rect x="305" y="250" width="235" height="60" rx="6" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="315" y="272" font-size="11" font-weight="bold" fill="#6d28d9">Merkezi Havuz (SIEM):</text>
  <text x="315" y="290" font-size="11" fill="#5b21b6">Yerel sunucudan anında dışarı aktarım</text>
  <text x="315" y="303" font-size="10" fill="#5b21b6">(Saldırgan izini silemesin)</text>

  <!-- Ok 2 -> 3 -->
  <line x1="560" y1="195" x2="610" y2="195" stroke="#0369a1" stroke-width="2.5" marker-end="url(#ok-log)"/>

  <!-- 3. Katman: Aktif İzleme ve İnceleme (Sağ) -->
  <rect x="620" y="65" width="315" height="260" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="620" y="65" width="315" height="38" rx="8" fill="#fef2f2"/>
  <text x="777" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">3 · İZLEME (MONITORING): AKTİF</text>

  <rect x="635" y="115" width="285" height="60" rx="6" fill="#fff1f2" stroke="#fecdd3"/>
  <text x="645" y="137" font-size="11" font-weight="bold" fill="#991b1b">Kural Motoru ve Alarmlar:</text>
  <text x="645" y="155" font-size="11" fill="#7f1d1d">• Mesai dışı toplu indirme</text>
  <text x="645" y="169" font-size="11" fill="#7f1d1d">• 3 ardışık hatada hesap kilidi</text>

  <rect x="635" y="185" width="285" height="60" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="645" y="207" font-size="11" font-weight="bold" fill="#92400e">İnsan İncelemesi (Review):</text>
  <text x="645" y="225" font-size="11" fill="#78350f">• Güvenlik uzmanı anomali analizi</text>
  <text x="645" y="239" font-size="11" fill="#78350f">• Şüpheli kayıtları tutanağa bağlama</text>

  <rect x="635" y="255" width="285" height="55" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="645" y="277" font-size="11" font-weight="bold" fill="#15803d">Denetim İzi (Audit Trail):</text>
  <text x="645" y="295" font-size="11" fill="#14532d">Hukuki ve kurumsal kanıt değeri taşır</text>

  <!-- Alt Ayrım Özeti -->
  <rect x="25" y="340" width="910" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="45" y="356" font-size="12" font-weight="bold" fill="#0f172a">Kritik Pedagojik Ayrım:</text>
  <text x="45" y="375" font-size="12" fill="#334155">«Log tutmak kütüphaneye kitap koymaktır; izlemek ise birinin o kitabı gece gizlice kopyalayıp kopyalamadığını fark etmektir.</text>
  <text x="45" y="393" font-size="12" fill="#334155">İzlenmeyen log, sadece olay gerçekleştikten sonra delil aramak için işe yarar.»</text>
</svg>
