<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="baslik aciklama" font-family="DejaVu Sans, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#0f172a">
  <title id="baslik">Parola Saklama Güvenliği: Tuzlama ve Tek Yönlü Özet (Salted Hash)</title>
  <desc id="aciklama">Düz metin parolanın rastgele üretilen bir tuz ile birleştirilip kriptografik özet fonksiyonundan geçirilerek veritabanında salt ve hash olarak saklanışını ve doğrulama mekanizmasını gösteren şema.</desc>
  <defs>
    <marker id="ok-hash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 1 L9 5 L0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="ok-onay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 1 L9 5 L0 9 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect width="960" height="420" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Başlık -->
  <text x="480" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">PAROLA GÜVENLİĞİ: TUZLAMA (SALT) VE TEK YÖNLÜ ÖZET (HASH) MEKANİZMASI</text>

  <!-- Sol Panel: Parola Oluşturma / Kayıt Süreci -->
  <rect x="30" y="60" width="435" height="260" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="30" y="60" width="435" height="36" rx="8" fill="#f1f5f9"/>
  <text x="247" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">AŞAMA 1 · KAYIT VE SAKLAMA MEKANİZMASI</text>

  <!-- Girdiler -->
  <rect x="45" y="110" width="130" height="45" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="110" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">Kullanıcı Parolası</text>
  <text x="110" y="146" text-anchor="middle" font-size="11" fill="#7f1d1d">"P@ssw0rd*2026"</text>

  <text x="185" y="138" font-size="16" font-weight="bold" fill="#64748b">+</text>

  <rect x="200" y="110" width="110" height="45" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="255" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">Rastgele Tuz</text>
  <text x="255" y="146" text-anchor="middle" font-size="11" fill="#78350f">"x9$kL2!z"</text>

  <!-- Ok Fonksiyona -->
  <line x1="175" y1="165" x2="175" y2="185" stroke="#0284c7" stroke-width="2" marker-end="url(#ok-hash)"/>

  <!-- Hash Fonksiyonu Kutusu -->
  <rect x="65" y="190" width="220" height="50" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="175" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">Kriptografik Fonksiyon</text>
  <text x="175" y="228" text-anchor="middle" font-size="10" fill="#1e40af">Argon2id / bcrypt / PBKDF2</text>

  <!-- Ok Veritabanına -->
  <line x1="285" y1="215" x2="325" y2="215" stroke="#0284c7" stroke-width="2" marker-end="url(#ok-hash)"/>

  <!-- Veritabanı Kutusu -->
  <rect x="335" y="125" width="115" height="150" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="392" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">VERİTABANI</text>
  <text x="392" y="170" text-anchor="middle" font-size="10" fill="#64748b">Asla Düz Metin</text>
  <text x="392" y="184" text-anchor="middle" font-size="10" fill="#64748b">Tutulmaz!</text>
  <rect x="345" y="200" width="95" height="32" rx="4" fill="#e2e8f0"/>
  <text x="392" y="220" text-anchor="middle" font-size="9" font-family="monospace" fill="#0f172a">Salt + Hash</text>
  <text x="392" y="255" text-anchor="middle" font-size="9" fill="#166534">✓ Güvenli Saklama</text>

  <!-- Sağ Panel: Giriş / Doğrulama Süreci -->
  <rect x="495" y="60" width="435" height="260" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="495" y="60" width="435" height="36" rx="8" fill="#f0fdf4"/>
  <text x="712" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">AŞAMA 2 · GİRİŞ ANINDA DOĞRULAMA</text>

  <!-- Adımlar -->
  <text x="515" y="125" font-size="12" fill="#334155">1. Kullanıcı parolasını giriş ekranına yazar.</text>
  <text x="515" y="148" font-size="12" fill="#334155">2. Sistem DB'deki kayıtlı tuzu (salt) alır.</text>
  <text x="515" y="171" font-size="12" fill="#334155">3. Girilen parola + tuz ile özet yeniden hesaplanır.</text>

  <rect x="525" y="195" width="375" height="50" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="540" y="218" font-size="11" font-weight="bold" fill="#334155">Hesaplanan Özet</text>
  <text x="660" y="218" font-size="14" font-weight="bold" fill="#475569">== ?</text>
  <text x="710" y="218" font-size="11" font-weight="bold" fill="#334155">DB'deki Kayıtlı Özet</text>
  <text x="640" y="236" font-size="11" font-weight="bold" fill="#15803d">Eşleşiyorsa: Kimlik Doğrulandı ✓</text>

  <text x="515" y="280" font-size="11" fill="#475569">• DB sızsa bile saldırgan düz metin parolaları doğrudan göremez.</text>
  <text x="515" y="298" font-size="11" fill="#475569">• Tuzlama (salt), rainbow table ile kırmayı engeller.</text>

  <!-- Alt Kritik Kural Bandı -->
  <rect x="30" y="335" width="900" height="65" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="50" y="356" font-size="12" font-weight="bold" fill="#991b1b">KURUMSAL POLİTİKA KURALI:</text>
  <text x="50" y="375" font-size="12" fill="#7f1d1d">«Hiçbir yönetici, veritabanı yöneticisi veya yazılımcı kullanıcının parolasını göremez veya e-posta ile düz metin gönderemez.</text>
  <text x="50" y="393" font-size="12" fill="#7f1d1d">Sıfırlamada yalnızca tek kullanımlık güvenli bağlantı üretilir.»</text>
</svg>
