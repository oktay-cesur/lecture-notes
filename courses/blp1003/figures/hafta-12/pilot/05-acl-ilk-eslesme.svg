<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" fill="#0f172a" role="img" aria-labelledby="baslik aciklama" font-family="DejaVu Sans, sans-serif" font-size="13">
  <title id="baslik">IK-GIRIS listesinde ilk eşleşme ve aynı LAN yolu</title>
  <desc id="aciklama">Üstte İK PC'si (10.20.1.10) router'ın g0/0.20 arayüzüne giriş yönünde bağlı IK-GIRIS listesine paket gönderir. Liste sırayla uygulanır: 1. satır İK ağından 10.20.0.50 sunucusuna giden IP trafiğini engeller, 2. satır diğer tüm IP trafiğine izin verir, görünmeyen örtük satır en sonda her şeyi engeller. Paket P1 sunucuya gider, 1. satırla eşleşir ve engellenir; sunucuya ulaşmaz. Paket P2 dış sunucu 203.0.113.80 adresine gider, 1. satırla eşleşmez, 2. satırla eşleşir ve geçer. Altta muhasebe PC'sinin aynı LAN'daki sunucuya paketi yalnız switch üzerinden gider, router'a uğramaz ve router ACL'si onu değerlendirmez.</desc>
  <defs>
    <marker id="ok-dc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="ok-059669" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#059669"/>
    </marker>
    <marker id="ok-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1000" height="570" fill="#f8fafc"/>

  <rect x="20" y="60" width="170" height="110" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="105" y="95" text-anchor="middle" font-weight="bold" fill="#1e293b">İK PC</text>
  <text x="105" y="118" text-anchor="middle" fill="#0f172a">10.20.1.10</text>
  <text x="105" y="138" text-anchor="middle" fill="#0f172a">VLAN 20</text>

  <rect x="360" y="30" width="300" height="250" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="510" y="52" text-anchor="middle" font-weight="bold" font-size="15" fill="#1e293b">Kurum router'ı</text>
  <rect x="318" y="64" width="84" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="3"/>
  <text x="360" y="79" text-anchor="middle" font-size="11" fill="#475569">g0/0.20 giriş</text>
  <rect x="618" y="64" width="84" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="3"/>
  <text x="660" y="79" text-anchor="middle" font-size="11" fill="#475569">g0/0.10</text>

  <rect x="380" y="100" width="260" height="120" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8"/>
  <text x="510" y="120" text-anchor="middle" font-weight="bold" font-size="12" fill="#1e293b">IK-GIRIS (g0/0.20, giriş yönü)</text>
  <text x="392" y="146" font-size="12" fill="#475569">1  deny ip İK ağı → host 10.20.0.50</text>
  <text x="392" y="168" font-size="12" fill="#475569">2  permit ip any any</text>
  <text x="392" y="192" font-size="12" fill="#475569">−  deny ip any any (örtük, görünmez)</text>
  <text x="510" y="212" text-anchor="middle" font-size="11" fill="#475569">Sırayla bakılır; ilk eşleşen satır uygulanır</text>
  <text x="510" y="262" text-anchor="middle" font-size="11" fill="#475569">Listeler yalnız router'dan geçen paketleri görür</text>

  <line x1="190" y1="95" x2="296" y2="95" stroke="#dc2626" stroke-width="2" marker-end="url(#ok-dc2626)"/>
  <text x="243" y="85" text-anchor="middle" font-size="12" fill="#475569">P1 → 10.20.0.50</text>
  <line x1="298" y1="85" x2="316" y2="105" stroke="#dc2626" stroke-width="4"/>
  <line x1="316" y1="85" x2="298" y2="105" stroke="#dc2626" stroke-width="4"/>
  <text x="243" y="118" text-anchor="middle" font-size="12" fill="#475569">1. satır: engellenir</text>

  <line x1="190" y1="145" x2="378" y2="145" stroke="#059669" stroke-width="2" marker-end="url(#ok-059669)"/>
  <text x="270" y="137" text-anchor="middle" font-size="12" fill="#475569">P2 → 203.0.113.80</text>
  <text x="270" y="163" text-anchor="middle" font-size="12" fill="#475569">2. satır: geçer</text>

  <line x1="702" y1="75" x2="788" y2="95" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#ok-2563eb)"/>
  <text x="745" y="62" text-anchor="middle" font-size="11" fill="#475569">P1 ulaşmaz</text>
  <rect x="790" y="60" width="190" height="90" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="885" y="92" text-anchor="middle" font-weight="bold" fill="#1e293b">Muhasebe sunucusu</text>
  <text x="885" y="115" text-anchor="middle" fill="#0f172a">10.20.0.50</text>
  <text x="885" y="135" text-anchor="middle" fill="#0f172a">VLAN 10</text>

  <line x1="510" y1="280" x2="510" y2="338" stroke="#059669" stroke-width="2" marker-end="url(#ok-059669)"/>
  <text x="522" y="312" font-size="12" fill="#475569">P2 geçer: g0/1 yönüne</text>
  <rect x="400" y="340" width="220" height="60" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="510" y="366" text-anchor="middle" font-weight="bold" fill="#1e293b">Dış sunucu</text>
  <text x="510" y="386" text-anchor="middle" fill="#0f172a">203.0.113.80</text>

  <line x1="20" y1="425" x2="980" y2="425" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="20" y="445" font-weight="bold" fill="#1e293b">Aynı LAN yolu (P0)</text>
  <rect x="20" y="460" width="170" height="60" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="105" y="486" text-anchor="middle" font-weight="bold" fill="#1e293b">Muhasebe PC</text>
  <text x="105" y="506" text-anchor="middle" fill="#0f172a">10.20.0.10</text>
  <rect x="400" y="460" width="170" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="485" y="496" text-anchor="middle" fill="#0f172a">Switch</text>
  <rect x="790" y="460" width="190" height="60" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="885" y="486" text-anchor="middle" font-weight="bold" fill="#1e293b">Muhasebe sunucusu</text>
  <text x="885" y="506" text-anchor="middle" fill="#0f172a">10.20.0.50</text>
  <line x1="190" y1="490" x2="398" y2="490" stroke="#059669" stroke-width="2" marker-end="url(#ok-059669)"/>
  <line x1="570" y1="490" x2="788" y2="490" stroke="#059669" stroke-width="2" marker-end="url(#ok-059669)"/>
  <text x="500" y="445" text-anchor="middle" font-size="12" fill="#475569">P0: router'a uğramaz, router ACL'si değerlendirmez</text>
  <text x="500" y="552" text-anchor="middle" font-size="12" fill="#475569">P0'ın geçmesi ACL'nin izin verdiği anlamına gelmez; ACL bu paketi hiç görmedi.</text>
</svg>
