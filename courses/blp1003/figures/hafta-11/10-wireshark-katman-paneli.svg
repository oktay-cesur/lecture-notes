<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t10 d10">
<title id="t10">Wireshark paket ayrıntı panelinin temsili katman hiyerarşisi</title>
<desc id="d10">Temsili bir paket ayrıntı paneli, altı numaralı satırı dıştan içe girintili gösterir: 1 Frame (yakalama bilgisi), 2 bağlantı katmanı (Ethernet, Null/Loopback veya Linux cooked capture), 3 Internet Protocol Version 4 (kaynak ve hedef 127.0.0.1), 4 Transmission Control Protocol (8000 portu sunucu tarafında mı istemci tarafında mı), 5 Hypertext Transfer Protocol (POST / HTTP/1.1 ve başlıklar), 6 HTML Form URL Encoded (mesaj = AG-LAB-42). Beşinci ve altıncı satırlar kalın çerçevelidir: HTTP deneyinde uygulama verisinin okunduğu satırlar. Bu çizim gerçek bir Wireshark ekran görüntüsü değildir.</desc>
<style>
text{font-family:"DejaVu Sans",sans-serif;fill:#0f172a;font-size:13.5px}
.h{font-size:18px;font-weight:700;fill:#0f172a}.b{font-weight:700;fill:#1e293b}.c{text-anchor:middle}.s{font-size:12px;fill:#475569}.w{fill:#ffffff}
</style>
<rect width="900" height="470" fill="#f8fafc" />
<text x="20" y="28" class="h" font-size="18" style="font-size:18px">Paket ayrıntı paneli (temsili): dıştan içe katmanlar</text>
<rect x="20" y="50" width="860" height="300" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="8.1" />
<rect x="20" y="50" width="860" height="28" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="3" />
<text x="34" y="69" class="b" font-size="13.5" style="font-size:13.5px;fill:#2563eb">Packet Details (temsili)</text>
<g fill="#ffffff" stroke="#475569" stroke-width="1.5">
<rect x="30" y="92" width="840" height="38" />
<rect x="30" y="134" width="840" height="38" />
<rect x="30" y="176" width="840" height="38" />
<rect x="30" y="218" width="840" height="38" />
<rect x="30" y="260" width="840" height="38" stroke-width="3" stroke="#0d9488" fill="#f0fdfa" />
<rect x="30" y="302" width="840" height="38" stroke-width="3" stroke="#0d9488" fill="#f0fdfa" />
</g>
<g fill="#ffffff" stroke="#475569" stroke-width="1.5">
<circle cx="52" cy="111" r="11" stroke="#2563eb" fill="#eff6ff" /><circle cx="52" cy="153" r="11" stroke="#2563eb" fill="#eff6ff" /><circle cx="52" cy="195" r="11" stroke="#2563eb" fill="#eff6ff" /><circle cx="52" cy="237" r="11" stroke="#2563eb" fill="#eff6ff" /><circle cx="52" cy="279" r="11" stroke="#2563eb" fill="#eff6ff" /><circle cx="52" cy="321" r="11" stroke="#2563eb" fill="#eff6ff" />
</g>
<text x="52" y="115" class="c b" font-size="13.5" style="font-size:13.5px">1</text><text x="52" y="157" class="c b" font-size="13.5" style="font-size:13.5px">2</text><text x="52" y="199" class="c b" font-size="13.5" style="font-size:13.5px">3</text><text x="52" y="241" class="c b" font-size="13.5" style="font-size:13.5px">4</text><text x="52" y="283" class="c b" font-size="13.5" style="font-size:13.5px;fill:#0d9488">5</text><text x="52" y="325" class="c b" font-size="13.5" style="font-size:13.5px;fill:#0d9488">6</text>
<g fill="#0f172a">
<polygon points="78,104 87,111 78,118" />
<polygon points="96,146 105,153 96,160" />
<polygon points="114,188 123,195 114,202" />
<polygon points="132,230 141,237 132,244" />
<polygon points="150,272 159,279 150,286" />
<polygon points="168,314 177,321 168,328" />
</g>
<text x="94" y="116" class="b" font-size="13.5" style="font-size:13.5px">Frame</text>
<text x="112" y="158" class="b" font-size="13.5" style="font-size:13.5px">Bağlantı katmanı</text>
<text x="130" y="200" class="b" font-size="13.5" style="font-size:13.5px">Internet Protocol Version 4</text>
<text x="148" y="242" class="b" font-size="13.5" style="font-size:13.5px">Transmission Control Protocol</text>
<text x="166" y="284" class="b" font-size="13.5" style="font-size:13.5px;fill:#0d9488">Hypertext Transfer Protocol</text>
<text x="184" y="326" class="b" font-size="13.5" style="font-size:13.5px;fill:#0d9488">HTML Form URL Encoded</text>
<text x="450" y="116" font-size="13.5" style="font-size:13.5px">← çerçevenin yakalama bilgisi</text>
<text x="450" y="158" font-size="13.5" style="font-size:13.5px">← Ethernet, Null/Loopback veya Linux cooked capture</text>
<text x="450" y="200" font-size="13.5" style="font-size:13.5px">← kaynak ve hedef: 127.0.0.1</text>
<text x="450" y="242" font-size="13.5" style="font-size:13.5px">← 8000 sunucu tarafında mı, istemci tarafında mı?</text>
<text x="450" y="284" font-size="13.5" style="font-size:13.5px">← POST / HTTP/1.1 ve başlıklar</text>
<text x="450" y="326" font-size="13.5" style="font-size:13.5px">← mesaj = AG-LAB-42</text>
<text x="20" y="380" font-size="11.92" style="font-size:11.92px">Kalın çerçeveli satırlar (5 ve 6): HTTP deneyinde uygulama verisinin okunabildiği satırlar. HTTPS deneyinde bunların yerine TLS kayıtları görünür.</text>
<text x="20" y="402" font-size="13.4" style="font-size:13.4px">Girinti: her satır, bir öncekinin taşıdığı yükü gösterir (Wireshark bu satırları aynı düzeyde listeler). ▶ işareti açılabilir satırı belirtir.</text>
<text x="20" y="424" font-size="13.5" style="font-size:13.5px">Bu çizim temsili bir paneldir; gerçek bir Wireshark ekran görüntüsü değildir. Satır adları ve ayrıntılar sürüme göre değişebilir.</text>
<text x="20" y="446" font-size="13.5" style="font-size:13.5px">Numaralar yalnız satırları ayırt etmek içindir; bilgi çerçeve kalınlığı ve etiketlerle de taşınır, renge dayanmaz.</text>
</svg>
