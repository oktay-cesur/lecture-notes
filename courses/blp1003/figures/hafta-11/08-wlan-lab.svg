<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="t8 d8">
<title id="t8">11-U1 WLAN laboratuvar topolojisi</title>
<desc id="d8">Solda 10.30.0.0/24 alt ağı: kablosuz laptop (SSID Kampus-Lab, WPA2-Personal AES), katman-2 köprü olarak çalışan AP, VLAN 1 yönetim adresi 10.30.0.2/24 olan switch ve router'ın g0/0 arayüzü 10.30.0.1/24. DHCP havuzu 10.30.0.100–10.30.0.149, ağ geçidi 10.30.0.1. Sağda 10.30.1.0/24 alt ağı: router'ın g0/1 arayüzü 10.30.1.1/24 ve 10.30.1.10/24 adresli, ağ geçidi 10.30.1.1 olan HTTP (TCP 80) sunucusu. Laptop ile AP arası kesikli radyo, diğer bağlantılar düz kablodur. Beş numaralı işaret kanıt noktalarını gösterir: SSID bağlantısı, alınan IP, ağ geçidine ping, sunucuya ping, web sayfası.</desc>
<style>
text{font-family:"DejaVu Sans",sans-serif;fill:#0f172a;font-size:13.5px}
.h{font-size:18px;font-weight:700;fill:#0f172a}.b{font-weight:700;fill:#1e293b}.c{text-anchor:middle}.s{font-size:12px;fill:#475569}.w{fill:#ffffff}
</style>
<rect width="1000" height="540" fill="#f8fafc" />
<rect x="15" y="50" width="575" height="270" rx="9.0" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="10 5" />
<text x="30" y="75" class="h" font-size="18" style="font-size:18px">10.30.0.0/24</text><text x="30" y="92" class="s" font-size="12" style="font-size:12px">DHCP havuzu .100–.149 · ağ geçidi 10.30.0.1</text>
<rect x="740" y="50" width="245" height="270" rx="9.0" fill="#fffbeb" stroke="#d97706" stroke-width="2" stroke-dasharray="3 5" />
<text x="755" y="75" class="h" font-size="18" style="font-size:18px">10.30.1.0/24</text>
<rect x="30" y="170" width="140" height="80" rx="9.0" fill="#eff6ff" stroke="#2563eb" stroke-width="2" /><text x="100" y="192" class="c b" font-size="13.5" style="font-size:13.5px;fill:#2563eb">Laptop</text><text x="100" y="208" class="c s" font-size="12" style="font-size:12px">kablosuz istemci</text><text x="100" y="223" class="c s" font-size="12" style="font-size:12px">Kampus-Lab</text><text x="100" y="238" class="c s" font-size="11.94" style="font-size:11.94px">WPA2-Personal / AES</text>
<rect x="230" y="170" width="110" height="80" rx="9.0" fill="#eff6ff" stroke="#2563eb" stroke-width="2" /><text x="285" y="195" class="c b" font-size="13.5" style="font-size:13.5px;fill:#2563eb">AP</text><text x="285" y="213" class="c s" font-size="11.84" style="font-size:11.84px">katman-2 köprü</text><text x="285" y="228" class="c s" font-size="12" style="font-size:12px">IP vermez,</text><text x="285" y="243" class="c s" font-size="12" style="font-size:12px">ağ geçidi değil</text>
<rect x="400" y="170" width="120" height="80" rx="9.0" fill="#eff6ff" stroke="#2563eb" stroke-width="2" /><text x="460" y="195" class="c b" font-size="13.5" style="font-size:13.5px;fill:#2563eb">Switch</text><text x="460" y="213" class="c s" font-size="12" style="font-size:12px">VLAN 1 yönetim:</text><text x="460" y="228" class="c s" font-size="12" style="font-size:12px">10.30.0.2/24</text>
<rect x="590" y="150" width="150" height="120" rx="9.0" fill="#faf5ff" stroke="#7c3aed" stroke-width="3" /><text x="665" y="175" class="c b" font-size="13.5" style="font-size:13.5px;fill:#7c3aed">Router</text><text x="665" y="195" class="c s" font-size="12" style="font-size:12px">g0/0: 10.30.0.1/24</text><text x="665" y="212" class="c s" font-size="12" style="font-size:12px">g0/1: 10.30.1.1/24</text><text x="665" y="232" class="c s" font-size="12" style="font-size:12px">ağ geçidi + DHCP</text>
<rect x="780" y="170" width="190" height="90" rx="9.0" fill="#fffbeb" stroke="#d97706" stroke-width="2" /><text x="875" y="194" class="c b" font-size="13.5" style="font-size:13.5px;fill:#d97706">Sunucu 10.30.1.10/24</text><text x="875" y="212" class="c s" font-size="12" style="font-size:12px">ağ geçidi 10.30.1.1</text><text x="875" y="228" class="c s" font-size="12" style="font-size:12px">HTTP: TCP 80 açık</text>
<line x1="170" y1="210" x2="230" y2="210" stroke="#2563eb" stroke-width="3" stroke-dasharray="10 5" fill="#eff6ff" />
<line x1="340" y1="210" x2="400" y2="210" stroke="#0d9488" stroke-width="5" fill="#f0fdfa" />
<line x1="520" y1="210" x2="590" y2="210" stroke="#0d9488" stroke-width="5" fill="#f0fdfa" />
<line x1="740" y1="210" x2="780" y2="210" stroke="#0d9488" stroke-width="5" fill="#f0fdfa" />
<g fill="#ffffff" stroke="#475569" stroke-width="2"><circle cx="200" cy="190" r="12" stroke="#2563eb" fill="#eff6ff" /><circle cx="100" cy="145" r="12" stroke="#2563eb" fill="#eff6ff" /><circle cx="665" cy="128" r="12" stroke="#2563eb" fill="#eff6ff" /><circle cx="830" cy="145" r="12" stroke="#2563eb" fill="#eff6ff" /><circle cx="925" cy="145" r="12" stroke="#2563eb" fill="#eff6ff" /></g>
<g class="c b"><text x="200" y="194" class="c b" font-size="13.5" style="font-size:13.5px;fill:#2563eb">1</text><text x="100" y="149" class="c b" font-size="13.5" style="font-size:13.5px;fill:#2563eb">2</text><text x="665" y="132" class="c b" font-size="13.5" style="font-size:13.5px">3</text><text x="830" y="149" class="c b" font-size="13.5" style="font-size:13.5px;fill:#d97706">4</text><text x="925" y="149" class="c b" font-size="13.5" style="font-size:13.5px;fill:#d97706">5</text></g>
<text x="20" y="360" class="h" font-size="18" style="font-size:18px">Kanıt noktaları</text>
<text x="20" y="382" font-size="13.5" style="font-size:13.5px">1  SSID bağlantı durumu (katılım)</text>
<text x="20" y="402" font-size="13.5" style="font-size:13.5px">2  Alınan IP, maske, ağ geçidi (laptop, kablosuz arayüz)</text>
<text x="20" y="422" font-size="13.5" style="font-size:13.5px">3  ping 10.30.0.1 (ağ geçidi, aynı alt ağ)</text>
<text x="520" y="382" font-size="13.5" style="font-size:13.5px">4  ping 10.30.1.10 (router üzerinden uzak alt ağ)</text>
<text x="520" y="402" font-size="13.5" style="font-size:13.5px">5  http://10.30.1.10 (TCP 80, hizmet erişimi)</text>
<text x="20" y="455" class="b" font-size="13.5" style="font-size:13.5px">AP yönlendirici değildir: 802.11 çerçevelerini Ethernet'e köprüler.</text>
<text x="20" y="475" font-size="13.5" style="font-size:13.5px">Aynı alt ağdaki hedef (10.30.0.1) ARP ile doğrudan, başka alt ağdaki hedef (10.30.1.10) varsayılan ağ geçidi üzerinden ulaşılır.</text>
<line x1="20" y1="505" x2="70" y2="505" stroke="#2563eb" stroke-width="3" stroke-dasharray="10 5" fill="#eff6ff" /><text x="78" y="509" class="s" font-size="12" style="font-size:12px">radyo</text>
<line x1="140" y1="505" x2="190" y2="505" stroke="#0d9488" stroke-width="5" fill="#f0fdfa" /><text x="198" y="509" class="s" font-size="12" style="font-size:12px">kablo</text>
</svg>
