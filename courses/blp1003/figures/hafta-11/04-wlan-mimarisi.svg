<line x1="210" y1="420" x2="260" y2="420" stroke="#0d9488" stroke-width="5" fill="#f0fdfa" /><text x="268" y="424" class="s" font-size="12" style="font-size:12px">kablolu bağlantı</text>
<line x1="390" y1="415" x2="440" y2="415" stroke="#0d9488" stroke-width="2" fill="#f0fdfa" /><line x1="390" y1="425" x2="440" y2="425" stroke="#0d9488" stroke-width="2" fill="#f0fdfa" /><text x="448" y="424" class="s" font-size="12" style="font-size:12px">internet çıkışı</text>
<text x="40" y="455" class="s" font-size="12" style="font-size:12px">SSID insanın seçtiği ağ adıdır; BSSID, bağlanılan AP radyosunun tanımlayıcısıdır (MAC biçiminde). Aynı SSID birçok AP'de yayımlanabilir.</text>
