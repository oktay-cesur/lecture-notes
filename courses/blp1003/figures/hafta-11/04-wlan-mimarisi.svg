<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-labelledby="t4 d4">
<title id="t4">WLAN mimarisi: istemci, AP, dağıtım ağı, SSID ve BSSID</title>
<desc id="d4">Solda telefon ve dizüstü kablosuz istemciler kesikli radyo çizgileriyle iki AP'ye bağlanır. İki AP de aynı ağ adını (SSID Kampus-Lab) yayımlar ama farklı BSSID taşır: AA:BB:CC:00:00:01 ve AA:BB:CC:00:00:02. Her AP 802.11 ile Ethernet arasında köprü görevi görür. AP'ler düz kalın kablolarla switch'e, switch router'a bağlıdır. Router ağ geçidi ve bu laboratuvarda DHCP sunucusudur; çift çizgiyle internet ve sunuculara çıkar. Noktalı çizgi telefonun öteki AP'ye de bağlanabileceğini gösterir.</desc>
<style>
text{font-family:"DejaVu Sans",sans-serif;fill:#0f172a;font-size:13.5px}
.h{font-size:18px;font-weight:700;fill:#0f172a}.b{font-weight:700;fill:#1e293b}.c{text-anchor:middle}.s{font-size:12px;fill:#475569}.w{fill:#ffffff}
</style>
