<rect x="290" y="95" width="220" height="95" rx="8.1" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" />
<text x="400" y="118" class="c b" font-size="13.5" style="font-size:13.5px;fill:#0d9488">AP-1</text><text x="400" y="136" class="c" font-size="13.5" style="font-size:13.5px">SSID: Kampus-Lab</text><text x="400" y="153" class="c" font-size="13.5" style="font-size:13.5px">BSSID: AA:BB:CC:00:00:01</text><text x="400" y="173" class="c s" font-size="12" style="font-size:12px">802.11 ↔ Ethernet köprüsü</text>
<rect x="290" y="245" width="220" height="95" rx="8.1" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" />
<text x="400" y="268" class="c b" font-size="13.5" style="font-size:13.5px;fill:#0d9488">AP-2</text><text x="400" y="286" class="c" font-size="13.5" style="font-size:13.5px">SSID: Kampus-Lab</text><text x="400" y="303" class="c" font-size="13.5" style="font-size:13.5px">BSSID: AA:BB:CC:00:00:02</text><text x="400" y="323" class="c s" font-size="12" style="font-size:12px">802.11 ↔ Ethernet köprüsü</text>
