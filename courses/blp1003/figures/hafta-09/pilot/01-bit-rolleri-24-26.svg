<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="750" viewBox="0 0 1600 750" role="img" aria-labelledby="bt bd"><title id="bt">/24 bloğundan /26 alt ağlarına bit rolleri</title><desc id="bd">192.168.1.0/24 bloğunda ilk 24 bit ağ kısmı, son 8 bit host alanıdır. /26'da son oktetin soldaki 2 biti alt ağ kimliği olur, sağdaki 6 bit host kalır; ilk 24 bit sabittir.</desc><defs>
