<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" fill="#0f172a" role="img" aria-labelledby="t4 d4" font-family="DejaVu Sans, sans-serif" font-size="14">
  <title id="t4">Laboratuvar topolojisi: iki LAN, iki router</title>
  <desc id="d4">PC-A (10.20.0.10/23, ağ geçidi 10.20.0.1) SW-A üzerinden R1'in LAN arayüzüne (10.20.0.1/23) bağlıdır. R1'in ara bağlantı arayüzü 10.20.8.1/30, R2'ninki 10.20.8.2/30'dur. R2'nin LAN arayüzü 10.20.2.1/23'tür ve SW-B üzerinden PC-B'ye (10.20.2.20/23, ağ geçidi 10.20.2.1) bağlanır. R1'e 10.20.2.0/23 için 10.20.8.2 üzerinden statik rota, R2'ye 0.0.0.0/0 için 10.20.8.1 üzerinden varsayılan rota eklenecektir.</desc>
