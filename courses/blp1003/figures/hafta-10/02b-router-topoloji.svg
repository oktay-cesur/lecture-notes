  <text x="855" y="115" text-anchor="middle" font-size="12" fill="#475569">kayıt: 203.0.113.64/26</text>

  <line x1="570" y1="240" x2="760" y2="240" stroke="#2563eb" stroke-width="3" marker-end="url(#ok-2563eb)"/>
