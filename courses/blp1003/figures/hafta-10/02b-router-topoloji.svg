  <text x="265" y="310" text-anchor="middle" font-size="12" fill="#475569">tablosunda yalnız</text>
  <text x="265" y="326" text-anchor="middle" font-size="12" fill="#475569">0.0.0.0/0 → 10.0.0.2</text>

  <line x1="330" y1="240" x2="420" y2="240" stroke="#475569" stroke-width="2"/>
  <text x="375" y="228" text-anchor="middle" font-size="11" fill="#475569">10.0.0.0/30</text>
  <text x="375" y="258" text-anchor="middle" font-size="11" fill="#475569">.1 ↔ .2</text>

  <rect x="420" y="60" width="150" height="360" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" rx="8"/>
  <text x="495" y="225" text-anchor="middle" font-weight="bold" fill="#1e293b">Router 2</text>
  <text x="495" y="245" text-anchor="middle" font-size="11" fill="#475569">Arayüz 1: 10.0.0.2/30</text>

