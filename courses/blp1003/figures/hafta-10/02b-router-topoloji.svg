<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" fill="#0f172a" role="img" aria-labelledby="t2b d2b" font-family="DejaVu Sans, sans-serif" font-size="14">
  <title id="t2b">A, Router 1 ve Router 2'nin üç komşusu</title>
  <desc id="d2b">A (10.20.0.10/23) Router 1'e bağlıdır. Router 1'in tablosunda yalnız 0.0.0.0/0 → 10.0.0.2 kaydı vardır ve 10.0.0.0/30 bağlantısıyla Router 2'nin arayüz 1'ine (10.0.0.2/30) gider. Router 2'nin üç arayüzü komşulara çıkar: arayüz 2 (10.0.1.1/30) komşu 10.0.1.2, kayıt 203.0.113.64/26; arayüz 3 (10.0.2.1/30) komşu 10.0.2.2, kayıt 203.0.113.0/24; arayüz 4 (10.0.3.1/30) komşu 10.0.3.2, kayıt 0.0.0.0/0. Paket 10.20.0.10'dan 203.0.113.78'e gider.</desc>
  <defs>
    <marker id="ok-059669" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="ok-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="#f8fafc"/>

