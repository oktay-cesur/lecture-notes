  <text x="80" y="255" text-anchor="middle" font-size="12" fill="#475569">10.20.0.10/23</text>
  <line x1="140" y1="240" x2="200" y2="240" stroke="#475569" stroke-width="2"/>

  <rect x="200" y="195" width="130" height="90" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" rx="8"/>
  <text x="265" y="222" text-anchor="middle" font-weight="bold" fill="#1e293b">Router 1</text>
