  <text x="665" y="366" text-anchor="middle" font-size="12" fill="#475569">Arayüz 4 · 10.0.3.1/30</text>
  <rect x="760" y="350" width="190" height="60" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8"/>
  <text x="855" y="375" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">komşu 10.0.3.2</text>
  <text x="855" y="395" text-anchor="middle" font-size="12" fill="#475569">kayıt: 0.0.0.0/0</text>

  <text x="20" y="360" font-size="12" fill="#475569">Paket: 10.20.0.10 → 203.0.113.78</text>
  <text x="20" y="450" font-size="12" fill="#475569">Her komşunun kutusunda Router 2'nin tablosundaki ilgili kayıt yazılıdır.</text>
