  <title id="t2">203.0.113.78 için /0, /24 ve /26 kayıtlarının karşılaştırdığı bitler</title>
  <desc id="d2">203.0.113.78 adresinin dördüncü oktetindeki 78 sayısı 01001110 bitleridir (64+8+4+2). /0 hiç bit karşılaştırmaz; /24 ilk üç oktetin 24 bitini, /26 bunlara dördüncü oktetin ilk iki bitini ekleyerek 26 bit karşılaştırır. Üçü de hedefi kapsar; en uzun önek /26 olduğu için /26 seçilir.</desc>
  
