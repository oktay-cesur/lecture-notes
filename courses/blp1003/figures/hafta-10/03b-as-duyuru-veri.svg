<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" fill="#0f172a" role="img" aria-labelledby="t3b d3b" font-family="DejaVu Sans, sans-serif" font-size="14">
  <title id="t3b">Otonom sistemler arasında duyuru yönü ve paket yönü</title>
  <desc id="d3b">Üç otonom sistem soldan sağa AS64496, AS64497 ve AS64498 olarak sıralanır; 203.0.113.0/24 AS64498'dedir. Adım 1: AS64498 öneki AS64497'ye duyurur. Adım 2: AS64497 politikası izin verirse AS64496'ya aktarır. Adım 3: AS64496 öğrenilen rotayı tablosuna yazar. Adım 4: bundan sonra AS64496'dan çıkan paketler AS64497 üzerinden AS64498'e gider. Duyuru okları kesik ve ince, paket okları sürekli ve kalındır; duyuru sağdan sola, paket soldan sağa akar.</desc>
  <defs>
    <marker id="ok-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="ok-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="440" fill="#f8fafc"/>

  <text x="20" y="32" font-size="17" font-weight="bold" fill="#1e293b">Duyuru yönü ile paket yönü ters</text>

  <rect x="60" y="80" width="200" height="90" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" rx="8"/>
  <text x="160" y="116" text-anchor="middle" font-weight="bold" fill="#1e293b">AS64496</text>
  <text x="160" y="138" text-anchor="middle" font-size="12" fill="#475569">paketin çıktığı taraf</text>
  <rect x="380" y="80" width="200" height="90" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" rx="8"/>
  <text x="480" y="116" text-anchor="middle" font-weight="bold" fill="#1e293b">AS64497</text>
  <text x="480" y="138" text-anchor="middle" font-size="12" fill="#475569">orta (geçiş)</text>
  <rect x="700" y="80" width="200" height="90" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" rx="8"/>
  <text x="800" y="116" text-anchor="middle" font-weight="bold" fill="#1e293b">AS64498</text>
  <text x="800" y="138" text-anchor="middle" font-size="12" fill="#475569">203.0.113.0/24 burada</text>

  <line x1="700" y1="110" x2="582" y2="110" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8,5" marker-end="url(#ok-7c3aed)"/>
  <text x="641" y="100" text-anchor="middle" font-size="12" fill="#475569">① duyuru</text>
  <line x1="380" y1="110" x2="262" y2="110" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8,5" marker-end="url(#ok-7c3aed)"/>
  <text x="321" y="100" text-anchor="middle" font-size="12" fill="#475569">② duyuru</text>

  <line x1="262" y1="145" x2="380" y2="145" stroke="#2563eb" stroke-width="5" marker-end="url(#ok-2563eb)"/>
  <text x="321" y="165" text-anchor="middle" font-size="12" fill="#475569">④ paket</text>
  <line x1="582" y1="145" x2="700" y2="145" stroke="#2563eb" stroke-width="5" marker-end="url(#ok-2563eb)"/>
  <text x="641" y="165" text-anchor="middle" font-size="12" fill="#475569">④ paket</text>

  <text x="160" y="200" text-anchor="middle" font-size="12" fill="#475569">③ tabloya yazar:</text>
  <text x="160" y="216" text-anchor="middle" font-size="12" fill="#475569">203.0.113.0/24 → AS64497 yönü</text>

  <text x="40" y="270" font-size="13" fill="#0f172a">① AS64498: 203.0.113.0/24 önekine buradan ulaşılabilir, diye duyurur.</text>
  <text x="40" y="292" font-size="13" fill="#0f172a">② AS64497: politikası izin verirse aynı önek bilgisini AS64496'ya aktarır.</text>
  <text x="40" y="314" font-size="13" fill="#0f172a">③ AS64496: öğrenilen rotayı tablosuna yazar.</text>
  <text x="40" y="336" font-size="13" fill="#0f172a">④ Ancak ③'ten sonra: hedefi 203.0.113.0/24 içinde olan paketler bu kayıtla AS64497 üzerinden iletilir.</text>

  <text x="40" y="390" font-size="13" font-weight="bold" fill="#1e293b">Kesikli ince ok: erişilebilirlik bilgisi (duyuru)   ·   Sürekli kalın ok: veri paketi</text>
  <text x="40" y="414" font-size="12" fill="#475569">Duyuru AS64498'den AS64496'ya akar; paket AS64496'dan AS64498'e akar. AS numaraları dokümantasyon içindir.</text>
</svg>
